[workspace]
resolver = "3"
members = [
  "api/commun",
  "api/security",
  "api/aegis",
  "api/entracte",
  "api/estompe/estompe-api",
  "api/estompe/core",
  "api/estompe/block",
  "api/estompe/blocks/*",
]
exclude = ["apps/estompe/crates", "apps/estompe/windows", "apps/estompe/android"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
aws-lc-rs = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hmac = "0.13"
html5gum = { version = "0.9", default-features = false }
http-body-util = "0.1"
include_dir = "0.7"
jsonschema = { version = "0.60", default-features = false }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
percent-encoding = "2"
quick-xml = "0.42"
rand = "0.10"
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "perf"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "tls-rustls-ring-webpki"] }
subtle = "2"
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "fs", "io-util"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
url = "2"
utoipa = { version = "6", features = ["yaml", "uuid"] }
utoipa-axum = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }
commun = { path = "api/commun" }
estompe-core = { path = "api/estompe/core" }
estompe-block = { path = "api/estompe/block" }
estompe-block-gifs = { path = "api/estompe/blocks/gifs" }
estompe-block-musique = { path = "api/estompe/blocks/musique" }
estompe-block-vocal = { path = "api/estompe/blocks/vocal" }
estompe-block-regarder-ensemble = { path = "api/estompe/blocks/regarder-ensemble" }
estompe-block-draw2gether = { path = "api/estompe/blocks/draw2gether" }
estompe-block-transcription = { path = "api/estompe/blocks/transcription" }
estompe-block-videos = { path = "api/estompe/blocks/videos" }
estompe-block-apercu-liens = { path = "api/estompe/blocks/apercu-liens" }
estompe-block-notifications = { path = "api/estompe/blocks/notifications" }
estompe-block-emojis = { path = "api/estompe/blocks/emojis" }
estompe-block-avatars = { path = "api/estompe/blocks/avatars" }
estompe-block-badges = { path = "api/estompe/blocks/badges" }
estompe-block-signalements = { path = "api/estompe/blocks/signalements" }
estompe-block-activite-statut = { path = "api/estompe/blocks/activite-statut" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"
