name: permission-dev
# Dépendances de dev : Postgres. Le backend tourne en local (`just permission-dev-run`), le front avec Vite (`just permission-front-dev`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: permission
      POSTGRES_PASSWORD: permission
      POSTGRES_DB: permission
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permission"]
      interval: 2s
      retries: 15
    tmpfs: [/var/lib/postgresql/data]
