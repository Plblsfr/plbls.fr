# Production : permission seul (image publiée par la CI). Dokploy ne clone pas le dépôt : coller ce fichier tel quel
# (Compose) ou créer une application Docker avec la même image. Le Postgres est une instance existante (voir README).
name: permission
services:
  permission:
    image: ghcr.io/plblsfr/permission:${PERMISSION_TAG:-latest}
    restart: unless-stopped
    environment:
      PERMISSION__DATABASE__URL: ${PERMISSION__DATABASE__URL}
      PERMISSION__IDENTITY__SECRET: ${PERMISSION__IDENTITY__SECRET}
      PERMISSION__SERVICES__TOKENS: ${PERMISSION__SERVICES__TOKENS:-}
      PERMISSION__MCP__TOKEN: ${PERMISSION__MCP__TOKEN:-}
      PERMISSION__SERVER__STATIC_DIR: static
      RUST_LOG: ${RUST_LOG:-info}
    expose: ["8080"]
