# Dépendances de dev : Redis, Keycloak (realm importé), Mailpit (SMTP :1025, boîte web :8025) et un service d'écho (en-têtes + WebSocket /echo).
# Le gateway tourne en local : `just security-dev up` puis `just security-dev start` (voir le justfile racine)
services:
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://localhost:8180
    ports: ["127.0.0.1:8180:8180"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180 && printf 'GET /realms/plbls/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 3s
      retries: 60
    volumes:
      - ./keycloak/plbls-realm.json:/opt/keycloak/data/import/plbls-realm.json:ro
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  whoami:
    image: traefik/whoami
    command: ["--port", "8081"]
    ports: ["127.0.0.1:8081:8081"]
