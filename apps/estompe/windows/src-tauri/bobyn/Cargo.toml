# Replay instantané (onglet Bobyn, Windows seulement) : espace de travail à part, utilisé par ../Cargo.toml.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
windows = { version = "0.61", features = [
  "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole",
  "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation",
  "Win32_Media_Audio", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_UI_Accessibility", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
] }
