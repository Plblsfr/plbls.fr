[package]
name = "estompe-client"
version = "0.0.0"
description = "Estompe — logique du client sans interface : types de l'API, HTTP, préférences, journal"
edition.workspace = true
publish.workspace = true
workspace = "../../natif"

[lints]
workspace = true

[dependencies]
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
