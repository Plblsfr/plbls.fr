[package]
name = "estompe-client"
version = "0.0.0"
description = "Estompe — logique du client sans interface : types de l'API, HTTP, préférences, journal"
edition.workspace = true
publish.workspace = true
workspace = "../../natif"

[lints]
workspace = true

[dependencies]
bytes = "1"
estompe-plateforme.workspace = true
form_urlencoded = "1"
getrandom = "0.4"
livekit = { version = "0.12", optional = true, default-features = false, features = ["native", "rustls-tls-native-roots"] }
nnnoiseless = { version = "0.5", default-features = false }
livekit-protocol = { version = "0.9", optional = true }
http-body = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
unsafe-libopus = "0.2"
url = "2"
minisign-verify = "0.3"
base64 = "0.23"
zune-core = "0.5"
zune-jpeg = "0.5"

[features]
livekit = ["dep:livekit", "dep:livekit-protocol"]

[[example]]
name = "mesure_vocal"
required-features = ["livekit"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
