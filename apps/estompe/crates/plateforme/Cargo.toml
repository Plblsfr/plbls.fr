[package]
name = "estompe-plateforme"
version = "0.0.0"
description = "Estompe — tout le code propre à un OS de l'app native, derrière des traits"
edition.workspace = true
publish.workspace = true
workspace = "../../natif"

[lints]
workspace = true

[dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
cpal = "0.18"
keyring = { version = "3", default-features = false, features = ["windows-native", "async-secret-service", "async-io", "crypto-rust"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
x11rb = { version = "0.13", features = ["xinput", "xtest"] }
