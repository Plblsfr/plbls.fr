[package]
name = "estompe-plateforme"
version = "0.0.0"
description = "Estompe — tout le code propre à un OS de l'app native, derrière des traits"
edition.workspace = true
publish.workspace = true
workspace = "../../natif"

[lints]
workspace = true

[dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
cpal = "0.18"
interprocess = "2"
nokhwa = { version = "0.10", default-features = false, features = ["input-v4l", "input-msmf"] }
keyring = { version = "3", default-features = false, features = ["windows-native", "async-secret-service", "async-io", "crypto-rust"] }
raw-window-handle = "0.6"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
serde_json.workspace = true
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
webbrowser = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["composite", "randr", "xfixes", "xinput"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "~4.18", default-features = false, features = ["z"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
xcap = { version = "0.9", default-features = false, features = ["wgc"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
x11rb = { version = "0.13", features = ["composite", "randr", "xfixes", "xinput", "xtest"] }
