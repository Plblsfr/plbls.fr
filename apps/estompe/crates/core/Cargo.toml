[package]
name = "estompe-core"
version = "0.0.0"
description = "Estompe — commandes Tauri communes à Windows et Android"
edition = "2021"
rust-version = "1.77"
publish = false

[dependencies]
tauri = { version = "2", features = [] }
# Appels à Keycloak et au gateway depuis Rust : pas d'en-tête Origin (Keycloak refuse celui du webview)
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Coffre de l'OS : Credential Manager sous Windows (le refresh token y est stocké, jamais sur disque en clair)
keyring = { version = "4", default-features = false, features = ["windows-native"] }
