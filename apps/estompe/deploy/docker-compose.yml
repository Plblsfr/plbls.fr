# Stack pour Dokploy (type « Compose »). Rien n'est lu dans le dépôt : l'API vient de l'image construite par la CI
# (job estompe-api-image de .github/workflows/livraison.yml, image Rust), LiveKit est configuré par variables, et les variables se saisissent dans Dokploy.
#
# Domaines (onglet Domains de Dokploy) :
#   - service estompe-web, port 80 : l'application (ex. estompe.plbls.fr) ; c'est l'origine à mettre dans ALLOWED_ORIGINS ;
#   - service estompe-api, port 8080 : un sous-domaine de plbls.fr (le cookie de session du gateway est posé sur .plbls.fr) ;
#   - service livekit, port 7880 : le domaine de LIVEKIT_URL (wss://...), HTTPS/WebSocket.
# Ports à ouvrir sur le VPS : 7881/tcp et 50000-50100/udp (WebRTC).
services:
  # Frontend web et PWA (le même code alimente l'app Windows, construite à part). Domaine : estompe.plbls.fr, port 80.
  estompe-web:
    image: ${ESTOMPE_WEB_IMAGE:-ghcr.io/plblsfr/estompe-web:latest}
    restart: unless-stopped
    environment:
      API_URL: ${API_PUBLIC_URL:?}
      GATEWAY_URL: ${GATEWAY_URL:-https://security.plbls.fr}
      VOICE_URL: ${LIVEKIT_URL:?}
    expose: ["80"]

  estompe-api:
    image: ${ESTOMPE_IMAGE:-ghcr.io/plblsfr/estompe:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://estompe:${POSTGRES_PASSWORD:?}@postgres:5432/estompe?sslmode=disable
      GATEWAY_URL: ${GATEWAY_URL:-https://security.plbls.fr}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?}
      PERMISSION_URL: ${PERMISSION_URL:-https://permission.plbls.fr}
      PERMISSION_TOKEN: ${PERMISSION_TOKEN:?}
      PERMISSION_NAME: ${PERMISSION_NAME:-estompe:access}
      DATA_DIR: /data
      MAX_STORAGE_GB: ${MAX_STORAGE_GB:-20}
      MAX_USER_STORAGE_MB: ${MAX_USER_STORAGE_MB:-2048}
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-100}
      LIVEKIT_URL: ${LIVEKIT_URL:?}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      LIVEKIT_ALLOW_VIDEO: ${LIVEKIT_ALLOW_VIDEO:-true}
      VOICE_MAX_SCREEN_FPS: ${VOICE_MAX_SCREEN_FPS:-}
      VOICE_MAX_SCREEN_HEIGHT: ${VOICE_MAX_SCREEN_HEIGHT:-}
      BLOCK_GIFS: ${BLOCK_GIFS:-true}
      BLOCK_MUSIQUE: ${BLOCK_MUSIQUE:-true}
      BLOCK_VOCAL: ${BLOCK_VOCAL:-true}
      BLOCK_REGARDER_ENSEMBLE: ${BLOCK_REGARDER_ENSEMBLE:-true}
      BLOCK_DRAW2GETHER: ${BLOCK_DRAW2GETHER:-true}
      BLOCK_TRANSCRIPTION: ${BLOCK_TRANSCRIPTION:-true}
      BLOCK_VIDEOS: ${BLOCK_VIDEOS:-true}
      BLOCK_APERCU_LIENS: ${BLOCK_APERCU_LIENS:-true}
      BLOCK_NOTIFICATIONS: ${BLOCK_NOTIFICATIONS:-true}
      BLOCK_EMOJIS: ${BLOCK_EMOJIS:-true}
      BLOCK_AVATARS: ${BLOCK_AVATARS:-true}
      BLOCK_BADGES: ${BLOCK_BADGES:-true}
      BLOCK_SIGNALEMENTS: ${BLOCK_SIGNALEMENTS:-true}
      BLOCK_ACTIVITE_STATUT: ${BLOCK_ACTIVITE_STATUT:-true}
      BLOCK_FILMS: ${BLOCK_FILMS:-false}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TRANSCRIBE_URL: ${TRANSCRIBE_URL:-}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-Systran/faster-whisper-small}
      TRANSCRIBE_LANGUAGE: ${TRANSCRIBE_LANGUAGE:-}
      TRANSCRIBE_ALPHA: ${TRANSCRIBE_ALPHA:-true}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      STREAM_SECRET: ${STREAM_SECRET:-}
      FILMS_MAX_FLUX: ${FILMS_MAX_FLUX:-2}
      FILMS_MAX_TRANSCODAGES: ${FILMS_MAX_TRANSCODAGES:-2}
      FILMS_CACHE_SECONDES: ${FILMS_CACHE_SECONDES:-60}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@plbls.fr}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
    volumes: [estompe-data:/data]
    depends_on: [postgres, livekit]
    expose: ["8080"]
    # Seule l'API rejoint le réseau de Jellyfin (voir JELLYFIN.md)
    networks: [default, jellyfin]

  # Reconnaissance vocale des messages vocaux (API compatible OpenAI, CPU) ; jamais exposé hors du réseau du compose.
  # Le modèle (TRANSCRIBE_MODEL) est téléchargé au premier usage dans le volume transcribe-models.
  transcribe:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes: [transcribe-models:/home/ubuntu/.cache/huggingface/hub]
    expose: ["8000"]

  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: estompe
      POSTGRES_USER: estompe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]

  # Sauvegarde quotidienne de la base (pg_dump compressé) dans le volume estompe-backups, avec rotation.
  # Restauration : voir deploy/BACKUP.md. Les fichiers (volume estompe-data) sont facultatifs : BACKUP_FILES=true.
  backup:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: estompe
      PGDATABASE: estompe
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_FILES: ${BACKUP_FILES:-false}
    volumes: [estompe-backups:/backups, estompe-data:/data:ro]
    depends_on: [postgres]
    command:
      - sh
      - -c
      - |
        set -u
        run() {
          f=/backups/db-$$(date +%F-%H%M).sql.gz
          if pg_dump --no-owner | gzip > $$f.tmp && [ -s $$f.tmp ]; then mv $$f.tmp $$f; echo "sauvegarde $$f ($$(du -h $$f | cut -f1))"; else rm -f $$f.tmp; echo "ÉCHEC de la sauvegarde" >&2; fi
          if [ "$${BACKUP_FILES:-false}" = true ]; then tar czf /backups/files-$$(date +%F).tar.gz -C /data . && echo "fichiers sauvegardés"; fi
          ls -1t /backups/db-*.sql.gz 2>/dev/null | tail -n +$$((${BACKUP_KEEP:-14} + 1)) | xargs -r rm -f
          ls -1t /backups/files-*.tar.gz 2>/dev/null | tail -n +$$((${BACKUP_KEEP:-14} + 1)) | xargs -r rm -f
        }
        [ "$${BACKUP_NOW:-true}" = true ] && run # une sauvegarde au démarrage, puis une par jour
        while true; do
          now=$$(date +%s); next=$$(date -d "$$(date +%F) $${BACKUP_HOUR:-03}:00" +%s 2>/dev/null || echo $$((now + 86400)))
          [ $$next -le $$now ] && next=$$((next + 86400))
          sleep $$((next - now)); run
        done

  livekit:
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}
        webhook:
          api_key: ${LIVEKIT_API_KEY:?}
          urls:
            - http://estompe-api:8080/voice/webhook
        room:
          max_participants: 10
        audio:
          # détection de la voix plus réactive (défaut : 500 ms lissés sur 2 intervalles, d'où le décalage de la bordure verte)
          update_interval: 150
          smooth_intervals: 1
    expose: ["7880"]
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

networks:
  # Réseau externe partagé avec le compose de Jellyfin ; sans films, le réseau de Dokploy convient (il existe toujours)
  jellyfin:
    external: true
    name: ${JELLYFIN_NETWORK:-dokploy-network}

volumes:
  pgdata:
  estompe-data:
  estompe-backups:
  transcribe-models:
