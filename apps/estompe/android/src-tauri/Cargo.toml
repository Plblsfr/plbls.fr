[package]
name = "estompe"
version = "0.83.0"
description = "Estompe — messagerie écrite et vocale"
edition = "2021"
rust-version = "1.77"

[lib]
name = "estompe_lib"
crate-type = ["rlib"] # la CI ajoute cdylib pour l'APK (scripts/release-android.sh)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
estompe-core = { path = "../../crates/core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
glib = { path = "../../vendor/glib" }
