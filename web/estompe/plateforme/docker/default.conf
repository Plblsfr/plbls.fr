server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    # Fichiers à empreinte : cache d'un an
    location /assets/ {
        include /etc/nginx/estompe-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tout le reste doit être revalidé (nouvelle version, config.js propre à l'environnement, service worker)
    location / {
        include /etc/nginx/estompe-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Mises à jour de l'app Windows (latest.json, installeurs signés) : copiés dans l'image par la CI (web/dist-updates)
    location /updates/ {
        alias /usr/share/nginx/updates/;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # APK : type et nom de fichier explicites ; absent, nginx répond 404 (jamais la page de l'application)
    location = /updates/Estompe.apk {
        alias /usr/share/nginx/updates/Estompe.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Estompe.apk"';
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
