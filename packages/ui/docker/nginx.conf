# Les versions exactes (/ui/2.0.0/…) ne changent jamais : cache d'un an.
# Les alias (/ui/latest/, /ui/2/) bougent à chaque publication : cache de 5 minutes.
map $uri $cdn_cache {
  default "public, max-age=300";
  ~^/ui/[0-9]+\.[0-9]+\.[0-9]+[^/]*/ "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;

  root /srv;
  autoindex off;

  gzip on;
  gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location / {
    # CORS ouvert : un <script type="module"> chargé d'un autre domaine l'exige.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    # sans « always » : pas de cache d'un an sur un 404
    add_header Cache-Control $cdn_cache;
    try_files $uri =404;
  }
}
