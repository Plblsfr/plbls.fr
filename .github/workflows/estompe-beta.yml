name: estompe-beta

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Numéro de la PR à publier en beta (vide : la branche choisie ci-dessus)"
        type: string
        required: false
  workflow_call:
    inputs:
      pr:
        type: string
        required: false

concurrency:
  group: estompe-beta
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/plblsfr/estompe-web

permissions:
  contents: read

jobs:
  front:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: ref
        env:
          PR: ${{ inputs.pr }}
        run: |
          if [ -z "$PR" ]; then echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$PR" =~ ^[0-9]+$ ]]; then echo "ref=refs/pull/$PR/head" >> "$GITHUB_OUTPUT"
          else echo "Numéro de PR invalide : $PR" >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm --prefix web/estompe run check
      - run: npm --prefix web/estompe test
      - run: npm --prefix web/estompe run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front-beta
          path: web/estompe/dist
          retention-days: 1

  image:
    needs: front
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.front.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: front-beta
          path: web/estompe/dist
      - run: mkdir -p web/estompe/plateforme/dist-updates
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_PAT || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=beta
            type=raw,value=beta-pr${{ inputs.pr }},enable=${{ inputs.pr != '' }}
            type=raw,value=beta-${{ needs.front.outputs.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web/estompe
          file: web/estompe/plateforme/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
      - name: Résumé
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SHA: ${{ needs.front.outputs.sha }}
          PR: ${{ inputs.pr }}
        run: |
          {
            echo "### Image beta publiée"
            echo
            echo "Source : ${PR:+PR #$PR, }commit \`$SHA\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Le service beta (image \`$IMAGE:beta\`) prend cette version à son prochain redémarrage ; \`latest\` n'est pas modifié."
          } >> "$GITHUB_STEP_SUMMARY"
