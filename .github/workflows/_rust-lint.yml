# Contrôles communs du workspace Cargo racine (security, permission, estompe) : toolchain de rust-toolchain.toml,
# version de Rust des Dockerfiles, cargo fmt, clippy -D warnings, cargo deny.
name: _rust-lint
on:
  workflow_call:
    inputs:
      name: { required: true, type: string }                # nom du cache
      packages: { type: string, default: '--workspace' }    # paquets passés à clippy, ex. « -p auth-gateway »

env:
  CARGO_DENY_VERSION: 0.20.2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain de rust-toolchain.toml
        run: rustup toolchain install && cargo --version
      - name: Les Dockerfiles suivent rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          ko=0
          for f in $(git ls-files "*Dockerfile"); do
            for tag in $(sed -n 's/^FROM rust:\([^ ]*\).*/\1/p' "$f"); do
              case "$tag" in "$channel"|"$channel"-*) ;; *) echo "$f : rust:$tag, attendu $channel (rust-toolchain.toml)" >&2; ko=1;; esac
            done
          done
          exit $ko
      - id: cargo
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-lint-v1-${{ inputs.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-lint-v1-${{ inputs.name }}-
      - id: deny
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}
      - run: cargo fmt --all --check
      - run: cargo clippy ${{ inputs.packages }} --all-targets --locked -- -D warnings
      - if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version ${{ env.CARGO_DENY_VERSION }}
      - run: cargo deny check
      - if: steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - if: steps.deny.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.deny.outputs.cache-primary-key }}
