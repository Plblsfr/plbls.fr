name: workspace-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Une seule version de Node
        run: node scripts/check-node.mjs
      - name: Copies de @plbls/ui à jour
        run: npm run ui:check
      - name: Tests des scripts communs
        run: node --test "scripts/*.test.mjs"
      - name: Liens Markdown internes
        run: node scripts/check-links.mjs
      - name: packages/ui (estompe, permission et pli ont leur propre workflow)
        run: |
          for script in check test build; do
            npm run "$script" --workspace packages/ui
          done
