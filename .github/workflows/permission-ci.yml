name: permission-ci
on:
  push:
    branches: [main]
    tags: ["permission-v*"]
    paths: ["package.json", "package-lock.json", ".nvmrc", "apps/permission/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", ".dockerignore", ".github/workflows/permission-ci.yml", ".github/workflows/_image.yml", ".github/workflows/_rust-lint.yml"]
  pull_request:
    paths: ["package.json", "package-lock.json", ".nvmrc", "apps/permission/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", ".dockerignore", ".github/workflows/permission-ci.yml", ".github/workflows/_image.yml", ".github/workflows/_rust-lint.yml"]
  workflow_dispatch:

concurrency:
  group: permission-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  packages: write

jobs:
  lint:
    uses: ./.github/workflows/_rust-lint.yml
    with:
      name: permission
      packages: -p permission

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/permission/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Types
        run: npm run check
      - name: Tests unitaires
        run: npm test

  image:
    needs: [lint, front]
    uses: ./.github/workflows/_image.yml
    with:
      component: permission
      name: permission
      context: .
      dockerfile: apps/permission/Dockerfile
      dir: apps/permission
      test_target: 'test'
    secrets: inherit
