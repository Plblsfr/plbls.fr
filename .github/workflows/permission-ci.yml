name: permission-ci
on:
  push:
    branches: [main]
    tags: ["permission-v*"]
    paths: ["package.json", "package-lock.json", ".nvmrc", "apps/permission/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", ".dockerignore", ".github/workflows/permission-ci.yml", ".github/workflows/_image.yml", ".github/workflows/_rust-lint.yml"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: permission-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  changements:
    runs-on: ubuntu-latest
    outputs:
      modifie: ${{ steps.c.outputs.modifie }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: c
        run: >-
          scripts/ci-changements.sh package.json package-lock.json .nvmrc 'apps/permission/**' Cargo.toml Cargo.lock rust-toolchain.toml deny.toml .dockerignore
          .github/workflows/permission-ci.yml .github/workflows/_image.yml .github/workflows/_rust-lint.yml scripts/ci-changements.sh

  lint:
    needs: changements
    if: needs.changements.outputs.modifie == 'true'
    uses: ./.github/workflows/_rust-lint.yml
    with:
      name: permission
      packages: -p permission

  front:
    needs: changements
    if: needs.changements.outputs.modifie == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/permission/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Types
        run: npm run check
      - name: Tests unitaires
        run: npm test

  image-pr:
    needs: [lint, front]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_image.yml
    with: &image
      component: permission
      name: permission
      context: .
      dockerfile: apps/permission/Dockerfile
      dir: apps/permission
      test_target: 'test'

  image:
    needs: [lint, front]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_image.yml
    with: *image
    secrets: inherit

  ok:
    name: permission-ci
    if: always()
    needs: [changements, lint, front, image-pr, image]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
