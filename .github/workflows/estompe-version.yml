name: estompe-version
on:
  push:
    branches: [main]
    paths: ["apps/estompe/**", "!apps/estompe/docs/**", "!apps/estompe/**.md", "!.github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estompe-version
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/estompe

jobs:
  version:
    if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          # PAT (contents + pull-requests) : avec GITHUB_TOKEN, la PR ouverte ne déclencherait aucune CI
          token: ${{ secrets.CI_PAT }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node frontend/scripts/bump-version.mjs
      - env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
        run: |
          git diff --quiet .version && exit 0
          b="ci/version-$(git rev-parse --short HEAD)"
          git ls-remote --exit-code --heads origin "$b" >/dev/null && { echo "la branche $b existe déjà : PR de version déjà ouverte"; exit 0; }
          git config user.name "estompe-ci" && git config user.email "ci@plbls.fr"
          git switch -c "$b"
          git commit -m "chore(version): mise à jour de .version" .version
          git push origin "$b"
          title="chore(version): $(node -p 'Object.entries(JSON.parse(require("fs").readFileSync(".version","utf8"))).map(([k,x])=>k+" "+x).join(", ")')"
          gh pr create --base main --head "$b" --title "$title" --body "Versions calculées par estompe-version.yml après la fusion du dernier commit de main. La fusion de cette PR ne change aucune version (seul .version est modifié)."
      - run: |
          f=backend/core/src/notes_version/changelog.json
          v=$(node -p 'JSON.parse(require("fs").readFileSync(".version", "utf8")).api')
          grep -q "\"version\": \"$v\"" "$f" || echo "::warning::pas d'entrée $v dans $f"
