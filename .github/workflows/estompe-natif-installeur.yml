name: estompe-natif-installeur

on:
  workflow_dispatch:
  push:
    branches: [ci/installeur-natif-windows]

permissions:
  contents: read

jobs:
  installeur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release
        working-directory: apps/estompe/natif
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: NSIS
        run: choco install nsis -y --no-progress
      - name: Installeur
        working-directory: apps/estompe/natif/installeur
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ../Cargo.toml | head -1)
          "/c/Program Files (x86)/NSIS/makensis.exe" -V2 "-DVERSION=$version" estompe-natif.nsi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: estompe-natif-installeur
          path: apps/estompe/natif/installeur/Estompe-natif-beta-setup.exe
          if-no-files-found: error
