name: security-ci
on:
  push:
    branches: [main]
    tags: ["security-v*"]
    paths: ["apps/security/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", ".dockerignore", ".github/workflows/security-ci.yml", ".github/workflows/_image.yml", ".github/workflows/_rust-lint.yml"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  changements:
    runs-on: ubuntu-latest
    outputs:
      modifie: ${{ steps.c.outputs.modifie }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: c
        run: >-
          scripts/ci-changements.sh 'apps/security/**' Cargo.toml Cargo.lock rust-toolchain.toml deny.toml .dockerignore
          .github/workflows/security-ci.yml .github/workflows/_image.yml .github/workflows/_rust-lint.yml scripts/ci-changements.sh

  lint:
    needs: changements
    if: needs.changements.outputs.modifie == 'true'
    uses: ./.github/workflows/_rust-lint.yml
    with:
      name: security
      packages: -p auth-gateway

  image-pr:
    needs: lint
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_image.yml
    with: &image
      component: security
      name: security
      context: .
      dockerfile: apps/security/Dockerfile
      dir: apps/security
      test_target: 'test'

  image:
    needs: lint
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_image.yml
    with: *image
    secrets: inherit

  ok:
    name: security-ci
    if: always()
    needs: [changements, lint, image-pr, image]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
