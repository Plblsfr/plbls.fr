name: pli-ci
on:
  push:
    branches: [main]
    tags: ["pli-v*"]
    paths: ["package.json", "package-lock.json", ".nvmrc", "apps/pli/**", ".github/workflows/pli-ci.yml", ".github/workflows/_image.yml"]
  pull_request:

concurrency:
  group: pli-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  changements:
    runs-on: ubuntu-latest
    outputs:
      modifie: ${{ steps.c.outputs.modifie }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: c
        run: scripts/ci-changements.sh package.json package-lock.json .nvmrc 'apps/pli/**' .github/workflows/pli-ci.yml .github/workflows/_image.yml scripts/ci-changements.sh

  test:
    needs: changements
    if: needs.changements.outputs.modifie == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pli
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pli" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test --workspace apps/pli
        env:
          TEST_DATABASE_URL: postgres://pli:test@localhost:5432/pli_test

  image-pr:
    needs: test
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_image.yml
    with: &image
      component: pli
      name: pli
      context: .
      dockerfile: apps/pli/Dockerfile
      dir: apps/pli

  image:
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_image.yml
    with: *image
    secrets: inherit

  ok:
    name: pli-ci
    if: always()
    needs: [changements, test, image-pr, image]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
