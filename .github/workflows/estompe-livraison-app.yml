name: estompe-livraison-app

on:
  push:
    tags: ["estompe-app-v*"]
  workflow_dispatch:
    inputs:
      beta:
        description: "Publier seulement le front en image estompe-web:beta (voir estompe-beta.yml)"
        type: boolean
        default: false
      pr:
        description: "Avec beta : numéro de la PR, pour le tag beta-pr<n> (lancer sur la branche de la PR)"
        type: string
        required: false

concurrency:
  group: livraison-app-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/plblsfr/estompe-web

permissions:
  contents: read

jobs:
  beta:
    if: ${{ inputs.beta }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/estompe-beta.yml
    with:
      pr: ${{ inputs.pr }}
    secrets: inherit

  front:
    if: ${{ !inputs.beta }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/estompe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run check
      - run: npm test

  windows:
    if: ${{ !inputs.beta }}
    runs-on: ubuntu-latest
    environment: livraison
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/plblsfr/estompe-ci:4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.PACKAGES_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - id: installer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/estompe/plateforme/dist-updates
            web/estompe/dist
          key: installeur-${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'ci' }}-${{ vars.NATIVE_ALPHA }}-${{ hashFiles('api/estompe/core/updates.json', 'web/estompe/src/**', 'apps/estompe/windows/**', 'apps/estompe/crates/**', 'web/estompe/public/**', 'web/estompe/index.html', 'package-lock.json', 'web/estompe/vite.config.ts', 'scripts/estompe/**') }}
      - id: cargo-cache
        if: steps.installer.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            apps/estompe/windows/src-tauri/target
          key: tauri-win-${{ vars.NATIVE_ALPHA == '1' && 'alpha' || 'std' }}-${{ hashFiles('apps/estompe/windows/src-tauri/Cargo.lock') }}
          restore-keys: tauri-win-${{ vars.NATIVE_ALPHA == '1' && 'alpha' || 'std' }}-
      - name: Installeur Windows signé
        if: steps.installer.outputs.cache-hit != 'true'
        working-directory: apps/estompe/windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NATIVE_ALPHA: ${{ vars.NATIVE_ALPHA }}
        run: |
          npm ci --prefix ../../..
          if [ "$GITHUB_REF_TYPE" = tag ]; then export PROFILE=release; else export PROFILE=ci; fi
          scripts/release-windows.sh "Version $(printf %.7s "$GITHUB_SHA")"
      - if: steps.installer.outputs.cache-hit != 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            apps/estompe/windows/src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - if: steps.installer.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/estompe/plateforme/dist-updates
            web/estompe/dist
          key: ${{ steps.installer.outputs.cache-primary-key }}
      - name: Front web (le build Windows, neuf ou restauré du cache, a écrasé web/estompe/dist)
        run: npm ci && npm --prefix web/estompe run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front
          path: |
            web/estompe/plateforme/dist-updates
            web/estompe/dist

  android:
    if: ${{ !inputs.beta && vars.ANDROID_APK == '1' }}
    runs-on: ubuntu-latest
    environment: livraison
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""
      - id: android-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/estompe/android/src-tauri/target
          key: android-${{ hashFiles('apps/estompe/android/src-tauri/Cargo.lock', 'apps/estompe/android/src-tauri/gen/android/**/*.gradle*', 'apps/estompe/android/src-tauri/gen/android/gradle/**') }}
          restore-keys: android-
      - name: SDK et NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;26.3.11579264" && echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - name: APK signé
        working-directory: apps/estompe/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          npm ci --prefix ../../..
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/estompe.jks"
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > src-tauri/gen/android/app/google-services.json 2>/dev/null
          [ -s src-tauri/gen/android/app/google-services.json ] && grep -q project_info src-tauri/gen/android/app/google-services.json || rm -f src-tauri/gen/android/app/google-services.json
          ANDROID_KEYSTORE="$RUNNER_TEMP/estompe.jks" scripts/release-android.sh
      - if: steps.android-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/estompe/android/src-tauri/target
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: |
            web/estompe/plateforme/dist-updates/Estompe.apk
            web/estompe/plateforme/dist-updates/android.json

  image:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/estompe-app-v') && needs.front.result == 'success' && needs.windows.result == 'success' && needs.android.result != 'failure' }}
    needs: [front, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: front
          path: web/estompe
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.android.result == 'success'
        with:
          name: apk
          path: web/estompe/plateforme/dist-updates
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_PAT || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/estompe-app-v') }}
            type=sha,prefix=sha-
            type=match,pattern=estompe-app-v(.*),group=1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web/estompe
          file: web/estompe/plateforme/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
      - name: APK téléchargeable dans l'image publiée
        if: needs.android.result == 'success'
        run: |
          docker run -d --name front-check -e API_URL=https://example.test ${{ env.IMAGE }}:latest
          sleep 3
          apps/estompe/android/scripts/check-apk.sh front-check
          docker rm -f front-check


  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/estompe-app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || gh release view "$GITHUB_REF_NAME" >/dev/null
