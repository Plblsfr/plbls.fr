name: lint
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.svelte"
      - "**/*.css"
      - "**/*.json"
      - "**/*.sh"
      - "**/*.py"
      - ".nvmrc"
      - ".shellcheckrc"
      - "biome.json"
      - "ruff.toml"
      - "justfile"
      - "scripts/**"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUFF_VERSION: 0.16.9

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: just, shellcheck et ruff
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends just shellcheck
          pipx install "ruff==${RUFF_VERSION}"
      - run: npm ci
      - run: just lint
      - run: just check
