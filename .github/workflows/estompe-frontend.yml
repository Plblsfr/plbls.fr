name: estompe-frontend

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: apps/estompe

jobs:
  changements:
    runs-on: ubuntu-latest
    outputs:
      modifie: ${{ steps.c.outputs.modifie }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: c
        working-directory: .
        run: >-
          scripts/ci-changements.sh package.json package-lock.json .nvmrc 'apps/estompe/frontend/**' 'apps/estompe/windows/**' 'apps/estompe/android/**'
          'apps/estompe/crates/**' 'apps/estompe/web/**' .github/workflows/estompe-frontend.yml scripts/ci-changements.sh

  front:
    needs: changements
    if: needs.changements.outputs.modifie == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/estompe/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Audit des dépendances
        working-directory: .
        run: npm audit --omit=dev --audit-level=high --workspace apps/estompe/frontend
      - name: Types
        run: npm run check
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npm run build

  rust:
    needs: changements
    if: needs.changements.outputs.modifie == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends unzip libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/estompe/windows/src-tauri/target
            apps/estompe/windows/src-tauri/bobyn/target
            apps/estompe/android/src-tauri/target
          key: rust-test-${{ hashFiles('apps/estompe/windows/src-tauri/Cargo.lock', 'apps/estompe/windows/src-tauri/bobyn/Cargo.lock', 'apps/estompe/android/src-tauri/Cargo.lock') }}
          restore-keys: rust-test-
      - name: Tests de l'app Windows
        working-directory: apps/estompe/windows/src-tauri
        run: cargo test --lib
      - name: Tests du crate commun
        working-directory: apps/estompe/crates/core
        run: cargo test
      - name: Compilation de l'app Android (hors Android)
        working-directory: apps/estompe/android/src-tauri
        run: mkdir -p ../../frontend/dist && cargo check
      - name: Tests de Bobyn
        working-directory: apps/estompe/windows/src-tauri/bobyn
        run: cargo test
      - name: ffmpeg épinglé téléchargeable et vérifié
        run: TAURI_ENV_PLATFORM=windows node windows/scripts/fetch-ffmpeg.mjs && test -s windows/src-tauri/binaries/ffmpeg.exe
      - if: steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/estompe/windows/src-tauri/target
            apps/estompe/windows/src-tauri/bobyn/target
            apps/estompe/android/src-tauri/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

  ok:
    name: estompe-frontend
    if: always()
    needs: [changements, front, rust]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
