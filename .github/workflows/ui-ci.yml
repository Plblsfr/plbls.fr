name: ui-ci
on:
  push:
    branches: [main]
    tags: ["ui-v*"]
    paths: ["package.json", "package-lock.json", ".nvmrc", "packages/ui/**", ".github/workflows/ui-ci.yml", ".github/workflows/_image.yml"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  changements:
    runs-on: ubuntu-latest
    outputs:
      modifie: ${{ steps.c.outputs.modifie }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: c
        run: >-
          scripts/ci-changements.sh package.json package-lock.json .nvmrc 'packages/ui/**'
          .github/workflows/ui-ci.yml .github/workflows/_image.yml scripts/ci-changements.sh

  image-pr:
    needs: changements
    if: github.event_name == 'pull_request' && needs.changements.outputs.modifie == 'true'
    uses: ./.github/workflows/_image.yml
    with: &image
      component: ui
      name: plbls-ui
      context: .
      dockerfile: packages/ui/Dockerfile
      dir: packages/ui
      test_target: 'build'

  image:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_image.yml
    with: *image
    secrets: inherit

  ok:
    name: ui-ci
    if: always()
    needs: [changements, image-pr, image]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
