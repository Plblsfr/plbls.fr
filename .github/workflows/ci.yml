# CI de toute PR : un seul workflow, des jobs lancés selon ce que la PR touche (_changements.yml), puis le job final « ci »,
# seul contrôle obligatoire du ruleset avec « conventions » (pr-conventions.yml). Rien n'est rejoué sur main : livraison.yml publie.
name: ci
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.20.2
  RUFF_VERSION: 0.16.9

jobs:
  changements:
    if: github.head_ref != 'ci/version'
    uses: ./.github/workflows/_changements.yml

  # PR de version (ci/version, ouverte par livraison.yml) : seul .version change, aucun autre job ne tourne.
  version-seule:
    if: github.head_ref == 'ci/version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Seul .version change, au format attendu
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          autres="$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -vx '.version' || true)"
          [ -z "$autres" ] || { echo "::error::la PR de version ne doit modifier que .version, pas : $autres"; exit 1; }
          node -e 'const v = JSON.parse(require("fs").readFileSync(".version", "utf8")); const k = Object.keys(v).filter((e) => e !== "natif").sort().join(); if (k !== "android,api,web,windows" || !Object.values(v).every((x) => /^\d+\.\d+\.\d+$/.test(x))) { console.error(`::error::.version invalide : ${JSON.stringify(v)}`); process.exit(1) }'

  changelog:
    needs: changements
    # Dependabot ne rédige pas d'entrée de changelog : la montée de version est tracée par sa PR
    if: needs.changements.outputs.estompe == 'true' && !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Entrée de changelog d'Estompe
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF" in ci/*|docs/*|release/*) echo "Branche $HEAD_REF : entrée non exigée"; exit 0;; esac
          git diff --quiet "origin/$BASE_REF...HEAD" -- api/estompe web/estompe apps/estompe docs/estompe deploy/estompe scripts/estompe .version agents \
            && { echo "Aucun changement dans Estompe : entrée non exigée"; exit 0; }
          git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- 'changelog.d/*.md' | grep -v '^changelog.d/README.md$' | grep . \
            || { echo "::error::la PR doit ajouter un fichier changelog.d/<sujet>.md (voir changelog.d/README.md)"; exit 1; }

  front:
    needs: changements
    if: needs.changements.outputs.front == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Une seule version de Node, copies de @plbls/ui à jour, tests des scripts communs, liens Markdown internes
        run: |
          node scripts/check-node.mjs
          npm run ui:check
          node --test "scripts/*.test.mjs"
          node scripts/check-links.mjs
      - name: just, shellcheck et ruff
        if: needs.changements.outputs.lint == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends just shellcheck
          pipx install "ruff==${RUFF_VERSION}"
      - name: Lint (Biome, shellcheck, ruff)
        if: needs.changements.outputs.lint == 'true'
        run: just lint
      - name: Audit des dépendances d'Estompe
        if: contains(needs.changements.outputs.espaces, 'web/estompe')
        run: npm audit --omit=dev --audit-level=high --workspace web/estompe
      - name: Sections de l'app selon les permissions (e2e Playwright, API d'Estompe, d'Entracte, de Sillon, de Régie et de Sablier simulées)
        if: contains(needs.changements.outputs.espaces, 'web/estompe')
        run: |
          npm exec --workspace web/estompe -- playwright install --with-deps chromium
          npm run e2e:entracte --workspace web/estompe
          npm run e2e:sillon --workspace web/estompe
          npm run e2e:regie --workspace web/estompe
          npm run e2e:sablier --workspace web/estompe
      - name: Types, tests et build des projets touchés
        if: needs.changements.outputs.espaces != ''
        env:
          ESPACES: ${{ needs.changements.outputs.espaces }}
        run: |
          for espace in $ESPACES; do
            for script in check test build; do
              echo "::group::$espace : npm run $script"
              npm run "$script" --workspace "$espace"
              echo "::endgroup::"
            done
          done

  rust-lint:
    needs: changements
    if: needs.changements.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain de rust-toolchain.toml
        run: rustup toolchain install && cargo --version
      - name: Les Dockerfiles suivent rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          ko=0
          for f in $(git ls-files "*Dockerfile"); do
            for tag in $(sed -n 's/^FROM rust:\([^ ]*\).*/\1/p' "$f"); do
              case "$tag" in "$channel"|"$channel"-*) ;; *) echo "$f : rust:$tag, attendu $channel (rust-toolchain.toml)" >&2; ko=1;; esac
            done
          done
          exit $ko
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-lint-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-lint-v2-
      - id: deny
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Le cœur d'Estompe ne dépend d'aucun bloc
        run: "! cargo tree -p estompe-core -e normal --prefix none --locked | grep '^estompe-block-'"
      - if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version ${{ env.CARGO_DENY_VERSION }}
      - run: cargo deny check
      - if: steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - if: steps.deny.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.deny.outputs.cache-primary-key }}

  rust-test:
    needs: changements
    if: needs.changements.outputs.estompe_api == 'true' || needs.changements.outputs.catalogue_permissions == 'true' || needs.changements.outputs.aegis_server == 'true' || needs.changements.outputs.security_server == 'true' || needs.changements.outputs.entracte_server == 'true' || needs.changements.outputs.sillon_server == 'true' || needs.changements.outputs.sablier_server == 'true' || needs.changements.outputs.regie_server == 'true'
    runs-on: ubuntu-latest
    # le job tourne sur le runner (pas dans un conteneur) : les services ne sont joignables que par leur port publié
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-test-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-test-v1-
      - name: Tests de l'API Estompe (PostgreSQL 17)
        if: needs.changements.outputs.estompe_api == 'true' || needs.changements.outputs.catalogue_permissions == 'true'
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked $(scripts/estompe/paquets-cargo.sh)
      - name: Tests de la crate commun (identité signée, jetons de service, clients HTTP, file d'évènements avec Redis)
        if: needs.changements.outputs.aegis_server == 'true' || needs.changements.outputs.security_server == 'true' || needs.changements.outputs.entracte_server == 'true' || needs.changements.outputs.sillon_server == 'true' || needs.changements.outputs.sablier_server == 'true' || needs.changements.outputs.regie_server == 'true'
        env:
          TEST_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p commun
      - name: Tests d'aegis (PostgreSQL 17, Redis)
        if: needs.changements.outputs.aegis_server == 'true'
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p aegis
      - name: Tests de security (Redis, faux Keycloak)
        if: needs.changements.outputs.security_server == 'true'
        env:
          TEST_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p auth-gateway
      - name: ffmpeg pour les tests d'Entracte et de Sillon
        if: needs.changements.outputs.entracte_server == 'true' || needs.changements.outputs.sillon_server == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Tests d'Entracte (PostgreSQL 17, ffmpeg)
        if: needs.changements.outputs.entracte_server == 'true'
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked -p entracte
      - name: Tests de Sillon (PostgreSQL 17, ffmpeg)
        if: needs.changements.outputs.sillon_server == 'true'
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked -p sillon
      - name: Tests de Sablier (PostgreSQL 17, Redis)
        if: needs.changements.outputs.sablier_server == 'true'
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p sablier
      - name: Tests de Régie (services simulés)
        if: needs.changements.outputs.regie_server == 'true'
        run: cargo test --locked -p regie
      - if: steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

  estompe-tauri:
    needs: changements
    if: needs.changements.outputs.estompe_tauri == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends unzip ffmpeg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev pkg-config gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-gnu
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/estompe/windows/src-tauri/target
            apps/estompe/android/src-tauri/target
          key: tauri-test-v1-${{ hashFiles('apps/estompe/windows/src-tauri/Cargo.lock', 'apps/estompe/android/src-tauri/Cargo.lock') }}
          restore-keys: tauri-test-v1-
      - name: Tests de l'app Windows
        working-directory: apps/estompe/windows/src-tauri
        run: cargo test --lib
      - name: Tests de l'overlay natif (feature overlay-natif)
        working-directory: apps/estompe/windows/src-tauri
        run: cargo test --lib --features overlay-natif overlay_natif
      - name: Tests de l'instant replay et de l'éditeur de clips (feature instant-replay, logique sans GPU, export réel par le ffmpeg du runner)
        working-directory: apps/estompe/windows/src-tauri
        run: cargo test --lib --features instant-replay replay
      - name: Tests du crate commun
        working-directory: apps/estompe/crates/core
        run: cargo test
      - name: Compilation de l'app Android (hors Android)
        working-directory: apps/estompe/android/src-tauri
        run: mkdir -p ../../../../web/estompe/dist && cargo check
      - name: ffmpeg épinglé téléchargeable et vérifié
        run: TAURI_ENV_PLATFORM=windows node apps/estompe/windows/scripts/fetch-ffmpeg.mjs && test -s apps/estompe/windows/src-tauri/binaries/ffmpeg.exe
      - name: Compilation Windows de l'instant replay et de la capture de fenêtre (mingw, sans édition de liens)
        working-directory: apps/estompe/windows/src-tauri
        run: cargo check --lib --target x86_64-pc-windows-gnu --features "instant-replay capture-fenetre"
      - if: steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/estompe/windows/src-tauri/target
            apps/estompe/android/src-tauri/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

  # App native (Slint, sans webview) : workspace Cargo à part (apps/estompe/natif), toolchain stable. Mêmes contrôles que
  # scripts/estompe/natif-check.sh, puis lancement réel de l'app sous Xvfb.
  estompe-natif-linux:
    needs: changements
    if: needs.changements.outputs.estompe_natif == 'true'
    runs-on: ubuntu-latest
    env:
      ESTOMPE_COFFRE_EXIGE: 1
      CXX: clang++-21
      ESTOMPE_LIVEKIT_URL: ws://127.0.0.1:7880
      ESTOMPE_DBUS_EXIGE: 1
      ESTOMPE_FFMPEG_EXIGE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libfontconfig1-dev libfreetype-dev libxkbcommon-x11-0 libgl1-mesa-dri libegl1 xvfb dbus gnome-keyring libasound2-dev libglib2.0-dev ffmpeg
      - name: clang 21 (libwebrtc du SDK LiveKit est compilé contre la libc++ de Chromium)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends clang-21
      - name: Serveur LiveKit de dev (test d'intégration du vocal)
        run: docker compose -f deploy/docker-compose.dev.yml up -d livekit
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            apps/estompe/natif/target
          key: natif-linux-v1-${{ hashFiles('apps/estompe/natif/Cargo.lock') }}
          restore-keys: natif-linux-v1-
      - name: cargo-deny
        run: command -v cargo-deny || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - name: Portabilité, fichiers générés, fmt, clippy, cargo deny, tests (coffre de secrets réel, captures de rendu ; le binaire de l'app en sort)
        run: dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && scripts/estompe/natif-check.sh'
      - name: Lancement de l'app (fenêtre réelle sous Xvfb, moteur Skia)
        working-directory: apps/estompe/natif
        run: ESTOMPE_NATIF_DOSSIER="$RUNNER_TEMP/estompe-natif" timeout 120 xvfb-run -a -s "-screen 0 1400x900x24" target/debug/estompe-natif --essai-de-lancement
      - name: Captures obtenues, références et différences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: estompe-natif-captures
          path: apps/estompe/natif/target/tmp/captures
          if-no-files-found: ignore
      - if: steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            apps/estompe/natif/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

  # Cible Windows MSVC (imposée par le SDK Rust LiveKit du lot vocal) : build et tests sur un runner Windows.
  # CRT statique (apps/estompe/natif/.cargo/config.toml) : Skia n'a pas de binaires précompilés pour lui et se compile depuis ses sources,
  # une fois par version de skia-bindings : ses binaires sont gardés dans un petit cache à part (skia-windows-v1-), relu par SKIA_BINARIES_URL.
  # Les captures de rendu ne sont comparées que sous Linux.
  estompe-natif-windows:
    needs: changements
    if: needs.changements.outputs.estompe_natif == 'true'
    runs-on: windows-latest
    env:
      ESTOMPE_COFFRE_EXIGE: 1
      ESTOMPE_CAPTURES: ignorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: ninja (Skia compilé depuis ses sources en CRT statique, voir docs/estompe/natif.md)
        run: python -m pip install --disable-pip-version-check ninja==1.13.0
      - name: Chemins longs (dépendances de Skia clonées par git-sync-deps)
        run: git config --global core.longpaths true
      - name: LLVM 22.1.8 (clang-cl et libclang pour Skia, le STL de MSVC refuse le clang 20 du runner)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $installeur = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.8-win64.exe'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe' -OutFile $installeur
          $empreinte = (Get-FileHash -Algorithm SHA256 -Path $installeur).Hash.ToLowerInvariant()
          if ($empreinte -ne '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c') { throw "empreinte inattendue de l'installeur LLVM : $empreinte" }
          $dossier = Join-Path $env:RUNNER_TEMP 'llvm-22'
          Start-Process -FilePath $installeur -ArgumentList '/S', "/D=$dossier" -Wait -NoNewWindow
          if (-not (Test-Path (Join-Path $dossier 'bin\clang-cl.exe'))) { throw "clang-cl absent de $dossier" }
          & (Join-Path $dossier 'bin\clang-cl.exe') --version
          "LLVM_HOME=$dossier" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=$(Join-Path $dossier 'bin')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Join-Path $dossier 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - id: skia
        name: Binaires de Skia (version de skia-bindings, SKIA_BINARIES_URL)
        shell: bash
        run: |
          echo "version=$(sed -n '/^name = "skia-bindings"$/{n;s/^version = "\(.*\)"$/\1/p;}' apps/estompe/natif/Cargo.lock)" >> "$GITHUB_OUTPUT"
          echo "SKIA_BINARIES_URL=file://$(cygpath -m "$HOME/skia-binaires")/skia-binaries-{key}.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/skia-binaires
          key: skia-windows-v1-${{ steps.skia.outputs.version }}-${{ github.run_id }}
          restore-keys: skia-windows-v1-${{ steps.skia.outputs.version }}-
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/estompe/natif/target
          key: natif-windows-v2-${{ hashFiles('apps/estompe/natif/Cargo.lock') }}
          restore-keys: natif-windows-v2-
      - name: Build (x86_64-pc-windows-msvc)
        working-directory: apps/estompe/natif
        run: cargo build --locked --target x86_64-pc-windows-msvc
      - name: Tests, dont le coffre de secrets (Credential Manager)
        working-directory: apps/estompe/natif
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc
      - id: skia-archive
        name: Binaires de Skia archivés s'ils viennent d'être compilés, sorties intermédiaires de Skia retirées
        shell: bash
        run: scripts/estompe/natif-skia-binaires.sh apps/estompe/natif/target/x86_64-pc-windows-msvc/debug "$HOME/skia-binaires"
      - if: steps.skia-archive.outputs.nouvelle == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/skia-binaires
          key: skia-windows-v1-${{ steps.skia.outputs.version }}-${{ github.run_id }}
      - if: steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/estompe/natif/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

  estompe-api-image:
    needs: changements
    if: needs.changements.outputs.estompe_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/estompe/Dockerfile
          push: false
          load: true
          tags: estompe-api:pr-${{ github.run_id }}
          cache-from: type=registry,ref=ghcr.io/plblsfr/estompe:buildcache
      - name: L'image démarre et répond sur /readyz
        run: |
          docker run -d --name estompe-pr-pg-${{ github.run_id }} -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=estompe postgres:17-alpine
          timeout 60 sh -c 'until docker exec estompe-pr-pg-${{ github.run_id }} pg_isready -U postgres -h 127.0.0.1; do sleep 1; done'
          docker run -d --name estompe-pr-api-${{ github.run_id }} --network container:estompe-pr-pg-${{ github.run_id }} --env-file deploy/estompe/.env.example \
            -e DATABASE_URL='postgres://127.0.0.1:5432?sslmode=disable' -e DATABASE_USER=postgres -e DATABASE_PASSWORD=postgres \
            estompe-api:pr-${{ github.run_id }}
          timeout 60 sh -c 'until docker run --rm --network container:estompe-pr-pg-${{ github.run_id }} postgres:17-alpine wget -qO- http://127.0.0.1:8080/readyz; do sleep 1; done' \
            || { docker logs estompe-pr-api-${{ github.run_id }}; exit 1; }
      - if: always()
        run: docker rm -f estompe-pr-api-${{ github.run_id }} estompe-pr-pg-${{ github.run_id }}

  entracte-image:
    needs: changements
    if: needs.changements.outputs.image_entracte == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/entracte/Dockerfile
          push: false
          load: true
          tags: entracte:pr-${{ github.run_id }}
          cache-from: type=gha,scope=entracte
      - name: L'image démarre, applique ses migrations, répond sur /readyz et trouve ffmpeg
        run: |
          docker run -d --name entracte-pr-pg-${{ github.run_id }} -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=entracte postgres:17-alpine
          timeout 60 sh -c 'until docker exec entracte-pr-pg-${{ github.run_id }} pg_isready -U postgres -h 127.0.0.1; do sleep 1; done'
          docker run -d --name entracte-pr-api-${{ github.run_id }} --network container:entracte-pr-pg-${{ github.run_id }} --env-file deploy/entracte/.env.example \
            -e DATABASE_URL='postgres://127.0.0.1:5432?sslmode=disable' -e DATABASE_USER=postgres -e DATABASE_PASSWORD=postgres -e ENTRACTE_STREAM_SECRET= \
            -e ENTRACTE_TRANSCODE_MODE=vaapi entracte:pr-${{ github.run_id }}
          timeout 60 sh -c 'until docker run --rm --network container:entracte-pr-pg-${{ github.run_id }} postgres:17-alpine wget -qO- http://127.0.0.1:8080/readyz; do sleep 1; done' \
            || { docker logs entracte-pr-api-${{ github.run_id }}; exit 1; }
          docker exec entracte-pr-api-${{ github.run_id }} ffprobe -version > /dev/null
          timeout 60 sh -c 'until docker logs entracte-pr-api-${{ github.run_id }} 2>&1 | grep -q "repli sur le CPU"; do sleep 1; done' \
            || { docker logs entracte-pr-api-${{ github.run_id }}; exit 1; }
      - if: always()
        run: docker rm -f entracte-pr-api-${{ github.run_id }} entracte-pr-pg-${{ github.run_id }}

  sillon-image:
    needs: changements
    if: needs.changements.outputs.image_sillon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/sillon/Dockerfile
          push: false
          load: true
          tags: sillon:pr-${{ github.run_id }}
          cache-from: type=gha,scope=sillon
      - name: L'image démarre, applique ses migrations, répond sur /readyz et porte ffmpeg et ffprobe
        run: |
          docker run -d --name sillon-pr-pg-${{ github.run_id }} -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=sillon postgres:17-alpine
          timeout 60 sh -c 'until docker exec sillon-pr-pg-${{ github.run_id }} pg_isready -U postgres -h 127.0.0.1; do sleep 1; done'
          docker run -d --name sillon-pr-api-${{ github.run_id }} --network container:sillon-pr-pg-${{ github.run_id }} --env-file deploy/sillon/.env.example \
            -e DATABASE_URL='postgres://127.0.0.1:5432?sslmode=disable' -e DATABASE_USER=postgres -e DATABASE_PASSWORD=postgres \
            sillon:pr-${{ github.run_id }}
          timeout 60 sh -c 'until docker run --rm --network container:sillon-pr-pg-${{ github.run_id }} postgres:17-alpine wget -qO- http://127.0.0.1:8080/readyz; do sleep 1; done' \
            || { docker logs sillon-pr-api-${{ github.run_id }}; exit 1; }
          docker exec sillon-pr-pg-${{ github.run_id }} psql -U postgres -d sillon -Atc 'SELECT version FROM _sqlx_migrations WHERE success' | grep -qx 7 \
            || { docker logs sillon-pr-api-${{ github.run_id }}; exit 1; }
          docker exec sillon-pr-api-${{ github.run_id }} ffmpeg -version > /dev/null
          docker exec sillon-pr-api-${{ github.run_id }} ffprobe -version > /dev/null
      - if: always()
        run: docker rm -f sillon-pr-api-${{ github.run_id }} sillon-pr-pg-${{ github.run_id }}

  sablier-image:
    needs: changements
    if: needs.changements.outputs.image_sablier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/sablier/Dockerfile
          push: false
          load: true
          tags: sablier:pr-${{ github.run_id }}
          cache-from: type=gha,scope=sablier
      - name: L'image démarre, applique ses migrations et répond sur /readyz
        run: |
          docker run -d --name sablier-pr-pg-${{ github.run_id }} -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=sablier postgres:17-alpine
          timeout 60 sh -c 'until docker exec sablier-pr-pg-${{ github.run_id }} pg_isready -U postgres -h 127.0.0.1; do sleep 1; done'
          docker run -d --name sablier-pr-api-${{ github.run_id }} --network container:sablier-pr-pg-${{ github.run_id }} --env-file deploy/sablier/.env.example \
            -e DATABASE_URL='postgres://127.0.0.1:5432?sslmode=disable' -e DATABASE_USER=postgres -e DATABASE_PASSWORD=postgres \
            sablier:pr-${{ github.run_id }}
          timeout 60 sh -c 'until docker run --rm --network container:sablier-pr-pg-${{ github.run_id }} postgres:17-alpine wget -qO- http://127.0.0.1:8080/readyz; do sleep 1; done' \
            || { docker logs sablier-pr-api-${{ github.run_id }}; exit 1; }
          docker exec sablier-pr-pg-${{ github.run_id }} psql -U postgres -d sablier -Atc 'SELECT version FROM _sqlx_migrations WHERE success' | grep -qx 1 \
            || { docker logs sablier-pr-api-${{ github.run_id }}; exit 1; }
      - if: always()
        run: docker rm -f sablier-pr-api-${{ github.run_id }} sablier-pr-pg-${{ github.run_id }}

  regie-image:
    needs: changements
    if: needs.changements.outputs.image_regie == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/regie/Dockerfile
          push: false
          load: true
          tags: regie:pr-${{ github.run_id }}
          cache-from: type=gha,scope=regie
      - name: L'image démarre et répond sur /healthz
        run: |
          docker run -d --name regie-pr-api-${{ github.run_id }} -p 127.0.0.1:18094:8080 --env-file deploy/regie/.env.example regie:pr-${{ github.run_id }}
          timeout 60 sh -c 'until curl -fsS http://127.0.0.1:18094/healthz; do sleep 1; done' \
            || { docker logs regie-pr-api-${{ github.run_id }}; exit 1; }
      - if: always()
        run: docker rm -f regie-pr-api-${{ github.run_id }}

  image-aegis:
    needs: changements
    if: needs.changements.outputs.image_aegis == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/_image.yml
    with:
      component: aegis
      name: aegis
      context: .
      dockerfile: api/aegis/Dockerfile
      dir: api/aegis
      test_target: test

  image-security:
    needs: changements
    if: needs.changements.outputs.image_security == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/_image.yml
    with:
      component: security
      name: security
      context: .
      dockerfile: api/security/Dockerfile
      dir: api/security
      test_target: test

  image-ui:
    needs: changements
    if: needs.changements.outputs.image_ui == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/_image.yml
    with:
      component: ui
      name: plbls-ui
      context: .
      dockerfile: packages/ui/Dockerfile
      dir: packages/ui
      test_target: build

  ci:
    if: always()
    needs: [changements, version-seule, changelog, front, rust-lint, rust-test, estompe-tauri, estompe-natif-linux, estompe-natif-windows, estompe-api-image, entracte-image, sillon-image, sablier-image, regie-image, image-aegis, image-security, image-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Aucun job en échec ni annulé
        env:
          RESULTATS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTATS"
          if echo "$RESULTATS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi

  # Transition : contrôles exigés par l'ancien ruleset, tous calqués sur « ci ».
  # À supprimer une fois `scripts/configurer-github.sh` relancé (ruleset réduit à « ci » et « conventions »).
  anciens-controles:
    name: ${{ matrix.controle }}
    if: always()
    needs: ci
    strategy:
      matrix:
        controle: [npm, estompe-backend-rs, estompe-frontend, pli-ci, permission-ci, security-ci, ui-ci]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTAT: ${{ needs.ci.result }}
        run: '[ "$RESULTAT" = success ]'
