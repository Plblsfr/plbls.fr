name: estompe-ci-image

on:
  push:
    branches: [main]
    paths: ["apps/estompe/deploy/ci/**", ".github/workflows/estompe-ci-image.yml"]
  workflow_dispatch:

concurrency:
  group: ci-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: apps/estompe

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/estompe/deploy/ci
          push: true
          provenance: false
          tags: |
            ghcr.io/plblsfr/estompe-ci:latest
            ghcr.io/plblsfr/estompe-ci:4
          cache-from: type=registry,ref=ghcr.io/plblsfr/estompe-ci:buildcache
          cache-to: type=registry,ref=ghcr.io/plblsfr/estompe-ci:buildcache,mode=max
