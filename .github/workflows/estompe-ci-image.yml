name: estompe-ci-image

on:
  push:
    branches: [main]
    paths: ["apps/estompe/deploy/ci/**", ".github/workflows/estompe-ci-image.yml"]
  workflow_dispatch:

concurrency:
  group: ci-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: apps/estompe

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/estompe/deploy/ci
          push: true
          provenance: false
          tags: |
            ghcr.io/plblsfr/estompe-ci:latest
            ghcr.io/plblsfr/estompe-ci:4
          cache-from: type=registry,ref=ghcr.io/plblsfr/estompe-ci:buildcache
          cache-to: type=registry,ref=ghcr.io/plblsfr/estompe-ci:buildcache,mode=max
