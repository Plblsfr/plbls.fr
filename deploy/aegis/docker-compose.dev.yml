name: aegis-dev
# Dépendances de dev : Postgres et Redis éphémères. Le backend tourne en local (`just aegis-dev-run`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 2s
      retries: 15
    tmpfs: [/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
