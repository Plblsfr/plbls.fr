# Production : aegis et son Redis (image publiée par la CI). Dokploy ne clone pas le dépôt : coller ce fichier tel quel.
# PostgreSQL est une instance existante (base dédiée). Estompe et pli joignent aegis sur le réseau Docker (http://aegis:8080)
# et s'abonnent aux invalidations sur ce Redis (utilisateurs ACL en lecture du seul canal, voir docs/aegis/integration.md).
name: aegis
services:
  aegis:
    image: ghcr.io/plblsfr/aegis:${AEGIS_TAG:-latest}
    restart: unless-stopped
    environment:
      AEGIS__DATABASE__URL: ${AEGIS__DATABASE__URL}
      AEGIS__IDENTITY__SECRET: ${AEGIS__IDENTITY__SECRET}
      AEGIS__REDIS__URL: ${AEGIS__REDIS__URL:-redis://aegis-redis:6379}
      AEGIS__SERVICES__TOKENS: ${AEGIS__SERVICES__TOKENS:-}
      AEGIS__SERVER__ADMIN_ROLE: ${AEGIS__SERVER__ADMIN_ROLE:-aegis-admin}
      AEGIS__GATEWAY__URL: ${AEGIS__GATEWAY__URL:-}
      AEGIS__GATEWAY__INTERNAL_TOKEN: ${AEGIS__GATEWAY__INTERNAL_TOKEN:-}
      AEGIS__RESSOURCES__ALLOWED_HOSTS: ${AEGIS__RESSOURCES__ALLOWED_HOSTS:-estompe-api}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on: [aegis-redis]
    expose: ["8080"]
  aegis-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose: ["6379"]
