# Production de tous les services, une seule stack Dokploy (type Compose). Valeurs non secrètes : plbls.env (racine du dépôt), copié
# dans chaque image au build. Secrets : onglet Environment, que Dokploy écrit dans .env à côté de ce fichier en résolvant les références
# Vault (vault.plbls.<secret>:<CLE>) ; les backends Rust le chargent en entier (env_file), les autres services ne reçoivent que leurs
# variables, interpolées dans environment ou command. Contenu de l'onglet : deploy/.env.example puis deploy/<projet>/.env.example.
name: plbls

x-durci: &durci
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-lecture-seule: &lecture-seule
  read_only: true
  tmpfs: [/tmp]

services:
  auth-gateway:
    image: ghcr.io/plblsfr/security:${GATEWAY_TAG:-latest}
    restart: unless-stopped
    <<: [*durci, *lecture-seule]
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
    expose: ["8080"]
    networks: [default, dokploy-network, redis]

  redis:
    image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD est obligatoire}"]
    volumes: [redis-data:/data]
    expose: ["6379"]
    networks: [redis]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -Eq 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 5

  aegis:
    image: ghcr.io/plblsfr/aegis:${AEGIS_TAG:-latest}
    restart: unless-stopped
    <<: [*durci, *lecture-seule]
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
    expose: ["8080"]
    networks: [default, postgres-net, redis]

  entracte-api:
    image: ghcr.io/plblsfr/entracte:${ENTRACTE_TAG:-latest}
    restart: unless-stopped
    <<: *durci
    env_file: .env
    volumes:
      - ${ENTRACTE_MEDIAS:-/srv/medias}:${ENTRACTE_MEDIAS:-/srv/medias}:ro
      - entracte-transcodage:/tmp/entracte
    expose: ["8080"]
    networks: [default, postgres-net, medias]

  estompe-web:
    image: ghcr.io/plblsfr/estompe-web:${ESTOMPE_WEB_TAG:-latest}
    restart: unless-stopped
    <<: *durci
    environment:
      API_URL: ${API_URL:-}
      GATEWAY_URL: ${GATEWAY_URL:-}
      VOICE_URL: ${VOICE_URL:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      ENTRACTE_PUBLIC_URL: ${ENTRACTE_PUBLIC_URL:-}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  estompe-api:
    image: ghcr.io/plblsfr/estompe:${ESTOMPE_TAG:-latest}
    restart: unless-stopped
    <<: [*durci, *lecture-seule]
    env_file: .env
    volumes: [estompe-data:/data]
    depends_on:
      redis: { condition: service_healthy }
      livekit: { condition: service_started }
    expose: ["8080"]
    networks: [default, postgres-net, redis]

  transcribe:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    volumes: [transcribe-models:/home/ubuntu/.cache/huggingface/hub]
    expose: ["8000"]

  livekit:
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    restart: unless-stopped
    <<: *durci
    environment:
      LIVEKIT_KEYS: "estompe: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET est obligatoire}"
    command: ["--config", "/etc/livekit.yaml"]
    configs:
      - source: livekit
        target: /etc/livekit.yaml
    expose: ["7880"]
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  cdn:
    image: ghcr.io/plblsfr/plbls-ui:${CDN_TAG:-latest}
    restart: unless-stopped
    <<: *durci
    volumes: [cdn-data:/srv]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

configs:
  livekit:
    content: |
      port: 7880
      rtc:
        tcp_port: 7881
        port_range_start: 50000
        port_range_end: 50100
        use_external_ip: true
      webhook:
        api_key: estompe
        urls:
          - http://estompe-api:8080/voice/webhook
      room:
        max_participants: 10
      audio:
        update_interval: 150
        smooth_intervals: 1

networks:
  postgres-net:
    external: true
  dokploy-network:
    external: true
  medias:
    external: true
    name: ${MEDIAS_NETWORK:?MEDIAS_NETWORK est obligatoire (réseau de la stack média, jamais dokploy-network)}
  redis:
    internal: true

volumes:
  redis-data:
  estompe-data:
  transcribe-models:
  cdn-data:
  entracte-transcodage:
