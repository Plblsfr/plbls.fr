# Dépendances de dev de tous les projets, éphémères (aucun volume). Les backends et les fronts tournent en local avec deploy/dev.env.
# Tout : just dev-up. Une partie : docker compose -f deploy/docker-compose.dev.yml up -d --wait postgres redis
name: plbls-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5432:5432"]
    configs:
      - source: bases
        target: /docker-entrypoint-initdb.d/bases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
    tmpfs: [/var/lib/postgresql/data]

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://localhost:8180
    ports: ["127.0.0.1:8180:8180"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180 && printf 'GET /realms/plbls/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 3s
      retries: 60
    volumes:
      - ./security/keycloak/plbls-realm.json:/opt/keycloak/data/import/plbls-realm.json:ro

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  whoami:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    command: ["--port", "8081"]
    ports: ["127.0.0.1:8081:8081"]

configs:
  bases:
    content: |
      CREATE DATABASE aegis;
      CREATE DATABASE entracte;
      CREATE DATABASE estompe;
