[server]
bind = "0.0.0.0:8080"
# Frontend compilé servi en statique (SPA). Absent = API seule.
static_dir = "static"
# Rôle Keycloak (realm) qui donne accès à l'administration des permissions.
admin_role = "permission-admin"

# database.url : base « permission » du serveur commun (DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD)
# identity.secret : GATEWAY_IDENTITE_SECRET (commun avec le gateway)
# services.tokens : une variable PERMISSION_TOKEN_<SERVICE> par micro-service autorisé à interroger les permissions de n'importe quel compte
# gateway.url / gateway.internal_token : GATEWAY_INTERNE_URL et GATEWAY_INTERNE_TOKEN ; vides = recherche de comptes par e-mail désactivée
