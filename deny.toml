[graph]
targets = ["x86_64-unknown-linux-musl", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
ignore = [
  # astral-tokio-tar : abandonné (publié le 3 nov. 2026), aucune version corrigée. Simple avis « non maintenu », pas de faille.
  # Tiré uniquement par testcontainers (bases PostgreSQL des tests). À retirer quand testcontainers change de dépendance.
  { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar non maintenu, amené par testcontainers (tests seulement)" },
]

[licenses]
version = 2
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "BSL-1.0"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
