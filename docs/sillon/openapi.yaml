openapi: 3.1.0
info:
  title: Sillon
  version: 0.1.0
  description: |
    Service de musique de plbls.fr : bibliothèque gérée par Lidarr, lecture, playlists, ajout de musique et recommandation.
    Ce document suit le code : chaque route de `api/sillon/src/routes.rs` y figure, et rien d'autre (vérifié par un test).

    Authentification : cookie de session du gateway (`__Secure-plbls_sid`) ou `Authorization: Bearer` (apps natives),
    vérifié par `GET /auth/me` du gateway. Droits : permissions aegis `sillon:access`, `sillon:add`, `sillon:admin`,
    fermées par défaut. Requêtes modifiantes avec cookie : `Origin` dans `SILLON_ALLOWED_ORIGINS`, sinon 403 `bad_origin`.
    Erreurs : `{"error": "<code>", "message": "…"}`.
servers:
  - url: https://sillon-api.plbls.fr
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Secure-plbls_sid
    bearer:
      type: http
      scheme: bearer
  responses:
    "401":
      description: "`unauthorized` : connexion requise"
    "403":
      description: "`forbidden` : permission manquante (le message la nomme)"
    "502":
      description: "`gateway_unavailable` : service de connexion injoignable"
    "503":
      description: "`aegis_unavailable` : service de droits injoignable (routes soumises à une permission)"
security:
  - session: []
  - bearer: []
paths:
  /healthz:
    get:
      summary: "Santé du processus"
      security: []
      responses:
        "200": { description: "`{status, version}`" }
  /readyz:
    get:
      summary: "Base joignable"
      security: []
      responses:
        "200": { description: "`{status: ready}`" }
        "503": { description: "`not_ready`" }
  /me:
    get:
      summary: "Identité, permissions et sections à afficher (aucune permission Sillon exigée)"
      description: |
        `sections` liste ce que la personne peut ouvrir, dans cet ordre : `library` (`sillon:access`), `add` (`sillon:add`),
        `admin` (`sillon:admin`) ; vide sans aucune permission Sillon. aegis injoignable : permissions toutes fausses, sections vides.
      responses:
        "200": { description: "`{sub, name, email, permissions: {access, add, admin}, sections: [string]}`" }
        "401": { $ref: "#/components/responses/401" }
        "502": { $ref: "#/components/responses/502" }
  /internal/preview:
    get:
      summary: "Aperçu d'un lien Sillon pour une carte d'Estompe (de serveur à serveur)"
      description: |
        Jeton `SILLON_SERVICE_TOKEN` en `Authorization: Bearer`, envoyé par Estompe. Les droits de `sub` sont demandés à aegis :
        sans `sillon:access`, 403 avant toute lecture du catalogue. Une playlist (privée) répond toujours 404 `not_found`, avant
        même la lecture de `sub`, qu'elle existe ou non. `cover` dit quelle image afficher (`/albums/{id}/cover` ou
        `/artists/{id}/image`, qui exigent toujours `sillon:access`) ; `null` sans image.
      security: []
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [album, track, artist, playlist] } }
        - { name: id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: sub, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: "`{type, id, title, artist, album: uuid|null, cover: {kind: album|artist, id}|null}` ; `album` : l'album de la piste ou l'album lui-même (`null` pour un artiste) ; pour un artiste, `title` et `artist` valent son nom" }
        "400": { description: "`invalid` : type inconnu ou `sub` absent" }
        "401": { description: "`unauthorized` : jeton de service absent ou faux" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : identifiant inconnu, playlist, ou `SILLON_SERVICE_TOKEN` vide (route coupée, corps vide)" }
        "503": { $ref: "#/components/responses/503" }
  /artists:
    get:
      summary: "Artistes présents, par nom (sans accents), pagination par curseur"
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: "`next_cursor` de la page précédente" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: genre, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        "200": { description: "`{items: [Artiste], next_cursor: string|null}`, Artiste : `{id, name, overview, genres, image, fanart, available, album_count}`" }
        "400": { description: "`invalid` : limite, curseur ou genre invalide" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /artists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Fiche artiste et tous ses albums (absents compris, `available: false`)"
      responses:
        "200": { description: "Artiste et `albums: [Album]`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
  /artists/{id}/image:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Image de l'artiste, téléchargée depuis Lidarr et mise en cache"
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [poster, fanart], default: poster } }
        - { name: size, in: query, schema: { type: string, enum: [small, medium, large], default: small } }
      responses:
        "200": { description: "Image (JPEG, PNG, GIF ou WebP)" }
        "400": { description: "`invalid` : type ou taille inconnus" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : artiste ou image absents" }
        "502": { description: "`lidarr_unavailable` : Lidarr injoignable et image jamais mise en cache" }
  /albums/recent:
    get:
      summary: "Ajouts récents : albums présents, du plus récemment arrivé au plus ancien, pagination par curseur"
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: "`{items: [Album], next_cursor}`, Album : `{id, title, type, secondary_types, release_date, year, genres, cover, available, added_at, track_count, duration, artist: {id, name}}`" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /albums/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Fiche album et ses pistes, par disque et numéro (absentes comprises, `available: false`)"
      responses:
        "200": { description: "Album et `tracks: [Piste]`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
  /albums/{id}/cover:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Pochette de l'album, téléchargée depuis Lidarr et mise en cache"
      parameters:
        - { name: size, in: query, schema: { type: string, enum: [small, medium, large], default: small } }
      responses:
        "200": { description: "Image" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
        "502": { description: "`lidarr_unavailable`" }
  /tracks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Piste, présente ou absente"
      responses:
        "200": { description: "Piste : `{id, title, disc, number, duration, explicit, available, album: {id, title, year, cover}, artist: {id, name}, format: {codec, container, bitrate, sample_rate, channels, bits}|null}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
  /genres:
    get:
      summary: "Genres portés par au moins un artiste ou un album présent"
      responses:
        "200": { description: "`{items: [{name, artist_count, album_count}]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /search:
    get:
      summary: "Recherche plein texte sans accents dans les artistes, albums et pistes présents"
      description: "Mots entiers (`to_tsvector` avec `unaccent`) ou sous-chaîne (`LIKE` échappé), sans tenir compte des accents ni de la casse."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 }, description: "par catégorie" }
      responses:
        "200": { description: "`{artists: [Artiste], albums: [Album], tracks: [Piste]}`" }
        "400": { description: "`invalid` : recherche vide ou trop longue" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/status:
    get:
      summary: "État des synchronisations et de la bibliothèque"
      responses:
        "200": { description: "`{sync: [{source, succeeded_at, attempted_at, error}], running, configured: {lidarr, webhook}, library: {artists, albums, tracks, absent_tracks, files, rejected, size}}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/rejected:
    get:
      summary: "Fichiers écartés (nom seul et raison)"
      description: "Raisons : `hors_medias`, `extension_interdite`, `double_extension`, `conteneur_incoherent`, `sans_flux_audio`, `nom_suspect`, `analyse_impossible`."
      responses:
        "200": { description: "`{items: [{name, reason, seen_at}]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/sync:
    post:
      summary: "Lance une synchronisation (relancée à la fin de celle en cours s'il y en a une)"
      responses:
        "202": { description: "`{started: true}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /webhooks/lidarr:
    post:
      summary: "Webhook de Lidarr : relance la synchronisation (sauf évènements Test, Grab, santé et mise à jour)"
      description: "Jeton `SILLON_WEBHOOK_TOKEN` en mot de passe du Basic auth (nom libre), en `Authorization: Bearer` ou en `?token=…`."
      security: []
      responses:
        "204": { description: "Reçu" }
        "401": { description: "`unauthorized` : jeton absent ou faux" }
        "404": { description: "`SILLON_WEBHOOK_TOKEN` vide : webhook coupé" }
  /playlists:
    get:
      summary: "Playlists de la personne, de la plus récemment modifiée à la plus ancienne"
      responses:
        "200": { description: "`{items: [Playlist]}`, Playlist : `{id, name, description, track_count, duration, cover_albums: [uuid] (quatre premiers albums avec pochette, dans l'ordre de la playlist), created_at, updated_at}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
    post:
      summary: "Crée une playlist privée"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
      responses:
        "201": { description: "Playlist et `items: []`" }
        "400": { description: "`invalid` : nom vide ou trop long, description trop longue" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "422": { description: "`limit_reached` : 500 playlists au plus" }
  /playlists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Playlist et ses éléments, dans l'ordre (pistes absentes comprises, `available: false`)"
      responses:
        "200": { description: "Playlist et `items: [{id, position, added_at, track: Piste}]` ; `id` désigne l'élément (une même piste peut y être deux fois)" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : inconnue ou playlist d'une autre personne" }
    patch:
      summary: "Renomme ou décrit la playlist"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
      responses:
        "200": { description: "Playlist et ses éléments" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
    delete:
      summary: "Supprime la playlist"
      responses:
        "204": { description: "Supprimée" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
  /playlists/{id}/tracks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: "Ajoute à la fin des pistes, un album, un artiste ou une autre playlist (un seul contenu)"
      description: "Les pistes déjà présentes (ou répétées dans l'ajout) sont des doublons : écartées et signalées dans `duplicates`, ajoutées quand même avec `allow_duplicates: true`."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tracks: { type: array, maxItems: 10000, items: { type: string, format: uuid } }
                album: { type: string, format: uuid }
                artist: { type: string, format: uuid, description: "pistes présentes de l'artiste" }
                playlist: { type: string, format: uuid, description: "playlist de la même personne" }
                allow_duplicates: { type: boolean, default: false }
      responses:
        "200": { description: "Playlist, ses éléments, `added` (nombre) et `duplicates: [uuid]` (pistes en double)" }
        "400": { description: "`invalid` : aucun ou plusieurs contenus, identifiant invalide, piste inconnue" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : playlist, album, artiste ou playlist source inconnus" }
        "422": { description: "`limit_reached` : 10 000 pistes par playlist au plus" }
  /playlists/{id}/tracks/{item}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: item, in: path, required: true, schema: { type: string, format: uuid }, description: "identifiant de l'élément" }
    delete:
      summary: "Retire un élément ; les positions suivantes se resserrent"
      responses:
        "200": { description: "Playlist et ses éléments" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
  /playlists/{id}/move:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: "Déplace une plage d'éléments : `count` éléments depuis la position `from`, placés à la position `to` de la liste obtenue"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: integer, minimum: 0 }
                count: { type: integer, minimum: 1, default: 1 }
                to: { type: integer, minimum: 0 }
      responses:
        "200": { description: "Playlist et ses éléments (positions 0 à n-1, sans trou ni doublon)" }
        "400": { description: "`invalid` : plage hors de la playlist" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
  /likes:
    get:
      summary: "Identifiants likés, du plus récent au plus ancien"
      responses:
        "200": { description: "`{tracks: [uuid], albums: [uuid], artists: [uuid]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /likes/{kind}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [tracks, albums, artists] } }
    get:
      summary: "Likes d'un type ; « Titres likés » (`tracks`) se lit comme une playlist"
      responses:
        "200": { description: "`tracks` : `{name, track_count, duration, cover_albums, items: [{liked_at, track: Piste}]}` ; `albums` : `{items: [Album et liked_at]}` ; `artists` : `{items: [Artiste et liked_at]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : type inconnu" }
  /likes/{kind}/{id}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [tracks, albums, artists] } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: "Like une piste, un album ou un artiste (idempotent)"
      responses:
        "204": { description: "Liké" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : type ou cible inconnus" }
        "422": { description: "`limit_reached` : 50 000 likes par type au plus" }
    delete:
      summary: "Retire le like (idempotent)"
      responses:
        "204": { description: "Retiré" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : type inconnu" }
  /queue:
    get:
      summary: "File de lecture de la personne, la même sur tous ses appareils"
      description: |
        File : `{revision, source: {type, id, name}|null, index, position, shuffle, repeat, suggestions, seed, updated_at,
        items: [{id, suggested, discovery, track: Piste}]}`. `items` est dans l'ordre de lecture (mélangé si `shuffle`), `index` désigne l'élément
        courant, `position` la position en secondes dans la piste. `repeat` : `off`, `all`, `one`. `suggestions` : `off`, `light`
        (une piste suggérée toutes les 10 pistes de la source), `frequent` (toutes les 4), effectif en aléatoire seulement ;
        `suggested` : élément suggéré hors de la source ; `discovery` : piste d'un album téléchargé par la découverte pour cette personne ;
        `seed` : graine du mélange. Une piste absente reste dans la file (`available: false`) ; le client la passe. Sans file : révision 0, `items` vide.
      responses:
        "200": { description: "File" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
    put:
      summary: "Remplace la file (nouvelle lecture d'une source)"
      description: |
        Toute écriture sur la file porte `revision`, celle de la dernière file reçue : si elle a changé entre-temps, 409 `conflict` avec
        la file courante dans `queue`, rien n'est écrit. Pistes : `tracks` (obligatoire pour une source `search`), sinon celles de la source
        (`album` : toutes, par disque et numéro ; `artist` : pistes présentes ; `playlist` : ses éléments ; `likes` : « Titres likés »).
        `index` : piste de départ dans l'ordre de la source. `shuffle`, `repeat` et `suggestions` gardent leur valeur s'ils sont omis ;
        en aléatoire, la piste de départ passe en tête et le reste est ordonné par la recommandation (pas deux fois le même artiste
        à la suite quand c'est possible, pistes souvent sautées repoussées, transitions proches) ; avec `suggestions`, des pistes hors
        source sont insérées dans les 50 éléments à venir, et la recherche de découvertes est lancée en tâche de fond.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer }
                source:
                  type: object
                  properties:
                    type: { type: string, enum: [album, playlist, artist, likes, search] }
                    id: { type: string, format: uuid }
                    query: { type: string, maxLength: 100, description: "texte de la recherche (source `search`)" }
                tracks: { type: array, maxItems: 10000, items: { type: string, format: uuid } }
                index: { type: integer, minimum: 0, default: 0 }
                position: { type: number, minimum: 0, maximum: 86400, default: 0 }
                shuffle: { type: boolean }
                repeat: { type: string, enum: [off, all, one] }
                suggestions: { type: string, enum: [off, light, frequent] }
      responses:
        "200": { description: "File" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : source inconnue (ou playlist d'une autre personne)" }
        "409": { description: "`conflict` : révision périmée, file courante dans `queue`" }
        "422": { description: "`limit_reached` : 10 000 pistes dans la file au plus" }
    patch:
      summary: "Position, piste courante et modes ; envoyé à intervalle pendant la lecture et à chaque changement de piste"
      description: |
        `index` change de piste (position remise à 0 sauf si `position` est donnée). `step` (1 ou -1) passe à la piste disponible
        suivante ou précédente en sautant les absentes, en bouclant si `repeat` n'est pas `off` ; 422 `end_of_queue` s'il n'y en a pas.
        `shuffle: true` mélange (nouvelle graine, piste courante en tête), `false` rend l'ordre de la source en gardant la piste courante
        et retire les suggestions. En aléatoire avec `suggestions`, un changement de piste complète les suggestions des 50 éléments à venir
        quand moins de 25 sont planifiés ; `suggestions: off` retire les suggestions pas encore jouées.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer }
                index: { type: integer, minimum: 0 }
                position: { type: number, minimum: 0, maximum: 86400 }
                step: { type: integer, enum: [-1, 1] }
                shuffle: { type: boolean }
                repeat: { type: string, enum: [off, all, one] }
                suggestions: { type: string, enum: [off, light, frequent] }
      responses:
        "200": { description: "File" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "409": { description: "`conflict`" }
        "422": { description: "`end_of_queue`" }
  /queue/tracks:
    post:
      summary: "« Lire ensuite » (`mode: next`, juste après la piste courante) ou « ajouter à la file » (`mode: end`, à la fin)"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer }
                mode: { type: string, enum: [next, end], default: end }
                tracks: { type: array, maxItems: 10000, items: { type: string, format: uuid } }
                album: { type: string, format: uuid }
                artist: { type: string, format: uuid }
                playlist: { type: string, format: uuid }
      responses:
        "200": { description: "File" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
        "409": { description: "`conflict`" }
        "422": { description: "`limit_reached`" }
  /queue/remove:
    post:
      summary: "Retire des éléments de la file"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [revision, items]
              properties:
                revision: { type: integer }
                items: { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { description: "File" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "409": { description: "`conflict`" }
  /queue/move:
    post:
      summary: "Déplace une plage d'éléments de la file (comme `/playlists/{id}/move`) ; la piste courante reste la même"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [revision, from, to]
              properties:
                revision: { type: integer }
                from: { type: integer, minimum: 0 }
                count: { type: integer, minimum: 1, default: 1 }
                to: { type: integer, minimum: 0 }
      responses:
        "200": { description: "File" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "409": { description: "`conflict`" }
  /history:
    get:
      summary: "Écoutes récentes, de la plus récente à la plus ancienne, pagination par curseur"
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: "`{items: [{id, track: Piste, started_at, played, ended, counted, source: {type, id}|null, suggested}], next_cursor}`" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
    post:
      summary: "Enregistre une lecture, à la fin de chacune"
      description: |
        `ended` : `completed` si `ended_by` vaut `end` ou si la lecture atteint la fin de la piste (à 1 s près), sinon `skipped`
        (`ended_by: skip`, sortie avant la fin vers une autre piste) ou `interrupted` (`ended_by: stop`). `counted` : écoute qui compte
        (30 s au moins ou la moitié de la piste). `item` : élément de la file lu, d'où vient `suggested`. `id` (facultatif, choisi par le
        client) rend l'envoi idempotent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [track, played, ended_by]
              properties:
                id: { type: string, format: uuid }
                track: { type: string, format: uuid }
                played: { type: number, minimum: 0, description: "secondes écoutées, au plus la durée de la piste (+5 %, +5 s)" }
                ended_by: { type: string, enum: [end, skip, stop] }
                started_at: { type: string, format: date-time, description: "30 jours au plus dans le passé ; par défaut maintenant moins `played`" }
                source:
                  type: object
                  properties:
                    type: { type: string, enum: [album, playlist, artist, likes, search] }
                    id: { type: string, format: uuid }
                item: { type: string, format: uuid }
      responses:
        "201": { description: "`{id, ended, counted, suggested}`" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : piste inconnue" }
  /history/top/tracks:
    get:
      summary: "Pistes les plus écoutées (écoutes qui comptent) sur la période"
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [week, month, year, all], default: month } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: "`{items: [{track: Piste, plays}]}`" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /history/top/artists:
    get:
      summary: "Artistes les plus écoutés (écoutes qui comptent) sur la période"
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [week, month, year, all], default: month } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: "`{items: [{artist: Artiste, plays}]}`" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /tracks/{id}/playback:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: "Ouvre la lecture d'une piste : URL de flux signée, format, durée exacte et gains de volume"
      description: |
        Corps `{codecs?: [string], containers?: [string], quality?: originale|haute|normale|basse}` : codecs (`flac`, `mp3`, `opus`,
        `vorbis`, `aac`, `alac`, `pcm`…) et conteneurs (`flac`, `mp3`, `ogg`, `mp4`, `webm`, `wav`, `aiff`, `aac`…) que le client lit,
        32 au plus chacun ; sans `quality`, la préférence de la personne (`GET /preferences`).
        Lecture directe (fichier d'origine) quand le codec et le conteneur sont annoncés et que la qualité est `originale` (ou que la
        source, avec perte, ne dépasse pas le palier) ; sinon transcodage en Opus (Ogg) si le client annonce `opus` et `ogg`, en AAC (ADTS)
        sinon, à 96 (`basse`), 160 (`normale`) ou 256 kb/s (`haute`, et `originale` quand la lecture directe est impossible).
        Le transcodage démarre dès cette demande : la piste suivante peut être demandée d'avance pour le préchargement.
        `samples` et `sample_rate` : durée exacte de la source en échantillons (mesurée au décodage), identique en transcodage ;
        `encoder_delay` : échantillons (à `output_sample_rate`) à retirer au début du flux décodé (1024 en AAC, 0 en Opus, dont le
        pre-skip est appliqué par le décodeur, et en direct). `gain` : niveau intégré EBU R128 (`loudness`, LUFS), pic réel
        (`track_peak`, `album_peak`, dBTP) et gains à appliquer (dB) pour atteindre `reference` (-18 LUFS), piste et album (album : pistes
        déjà mesurées) ; `null` tant que la mesure est impossible. Le niveau est mesuré à la première lecture puis gardé en base.
      responses:
        "200": { description: "`{track, url, expires_at, mode: direct|transcode, quality, format: {codec, container, mime, bitrate}, duration, samples, sample_rate, output_sample_rate, encoder_delay, gain: {reference, loudness, track, track_peak, album, album_peak}}` ; `url` relative (`/stream/…`), valable 6 h" }
        "400": { description: "`invalid` : corps, liste ou qualité invalide" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : piste inconnue ou absente" }
        "503": { description: "`server_busy` : plafond de transcodages simultanés atteint (`Retry-After`), ou `aegis_unavailable`" }
  /stream/{jeton}:
    parameters:
      - { name: jeton, in: path, required: true, schema: { type: string } }
    get:
      summary: "Flux audio d'une piste (URL signée de `POST /tracks/{id}/playback`)"
      description: |
        Sans session : le jeton, signé (HMAC, `SILLON_STREAM_SECRET`), porte la personne, la piste, le fichier, le format et
        l'expiration ; les droits (`sillon:access`) sont vérifiés à chaque requête. Une session d'une autre personne : 403.
        Fichier d'origine ou fichier transcodé en cache : `Range` (206, `Content-Range`), `Content-Type` exact. Pendant l'encodage, le
        fichier est servi au fil de l'eau (200 sans `Content-Length`, `Accept-Ranges: none`) ; un échec d'encodage coupe la connexion,
        jamais un flux tronqué présenté comme complet. CORS ouvert (`*`, sans identifiants) aux origines non déclarées.
      security: []
      responses:
        "200": { description: "Audio" }
        "206": { description: "Audio, plage demandée" }
        "401": { description: "`stream_expired` : jeton expiré, modifié ou invalide" }
        "403": { description: "`forbidden` : flux d'une autre personne, ou `sillon:access` retirée" }
        "404": { description: "`not_found` : fichier de la piste changé ou disparu (redemander la lecture)" }
        "416": { description: "Plage impossible" }
        "502": { description: "`transcode_failed`, `transcode_timeout`" }
        "503": { description: "`server_busy` (`Retry-After`), `aegis_unavailable`" }
  /preferences:
    get:
      summary: "Préférences de la personne : qualité de lecture et découverte automatique"
      responses:
        "200": { description: "`{quality, qualities: [originale, haute, normale, basse], discovery}` ; `originale` et `discovery: true` par défaut" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
    put:
      summary: "Change la qualité de lecture par défaut, la découverte automatique, ou les deux ; un champ absent n'est pas modifié"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                quality: { type: string, enum: [originale, haute, normale, basse] }
                discovery: { type: boolean, description: "faux : aucun album n'est téléchargé pour cette personne par la découverte" }
      responses:
        "200": { description: "`{quality, qualities, discovery}`" }
        "400": { description: "`invalid` : valeur invalide, ou ni `quality` ni `discovery`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /additions/search:
    get:
      summary: "Recherche d'artistes et d'albums par la recherche de Lidarr (MusicBrainz), marqués présents, en cours ou exclus"
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        "200": { description: "`{artists: [{mbid, name, disambiguation, type, overview, in_library, in_progress, excluded}], albums: [{mbid, title, type, secondary_types, year, duration, artist: {mbid, name}, in_library, in_progress, excluded, estimated_size}]}` (20 au plus chacun)" }
        "400": { description: "`invalid` : recherche vide ou trop longue" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { description: "`lidarr_unavailable`" }
        "503": { description: "`not_configured` : Lidarr non configuré" }
  /additions:
    post:
      summary: "Ajoute un album (seul surveillé) ou un artiste (albums studio surveillés) : envoyé à Lidarr tout de suite, recherche lancée"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, mbid]
              properties:
                kind: { type: string, enum: [album, artist] }
                mbid: { type: string, format: uuid, description: "MBID MusicBrainz de l'album ou de l'artiste" }
      responses:
        "201": { description: "Ajout : `{id, kind, mbid, title, artist: {mbid, name}, origin: manual|discovery, state: sent|downloading|partial|available|failed|deleted, reason, estimated_size, albums: [uuid], created_at, updated_at}`" }
        "200": { description: "Ajout déjà en cours pour ce titre, avec `existing: true`" }
        "400": { description: "`invalid` : kind ou mbid invalide" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : inconnu de MusicBrainz" }
        "409": { description: "`already_available` (déjà dans la bibliothèque) ou `excluded` (retiré par un administrateur)" }
        "429": { description: "`daily_limit` : `SILLON_AJOUTS_PAR_JOUR` ajouts sur 24 heures glissantes" }
        "502": { description: "`lidarr_unavailable` : rien n'est enregistré" }
        "503": { description: "`not_configured` : Lidarr, dossier racine ou profils non configurés" }
        "507": { description: "`disk_full` : le plafond `SILLON_MEDIAS_GO` serait dépassé ; `{used, pending, limit, free, estimated}` ; rien n'est envoyé à Lidarr" }
  /additions/mine:
    get:
      summary: "Mes ajouts, du plus récent au plus ancien (200 au plus)"
      responses:
        "200": { description: "`{items: [Ajout]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/disk:
    get:
      summary: "Occupation du dossier de la musique et plafond"
      responses:
        "200": { description: "`{used, pending, limit, free, daily_limit, configured}` (octets ; `limit` et `free` nuls sans plafond)" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/additions:
    get:
      summary: "Ajouts de tous, avec leur auteur (500 au plus)"
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [sent, downloading, partial, available, failed, deleted] } }
      responses:
        "200": { description: "`{items: [Ajout et author: {sub, name}]}`" }
        "400": { description: "`invalid` : état inconnu" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/additions/{id}/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: "Relance un ajout en échec (plafond vérifié, recherche renvoyée à Lidarr)"
      responses:
        "201": { description: "Ajout relancé" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
        "409": { description: "`invalid_state` : l'ajout n'est pas en échec, ou le même titre est déjà en cours" }
        "502": { description: "`lidarr_unavailable` : l'ajout reste en échec" }
        "507": { description: "`disk_full`" }
  /admin/albums:
    get:
      summary: "Albums présents, du plus gros au plus petit"
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: never_played, in: query, description: "`true` : seulement les albums dont aucune piste n'a d'écoute comptée (`counted`) dans l'historique, toutes personnes confondues", schema: { type: boolean, default: false } }
      responses:
        "200": { description: "`{items: [Album et size, added_by]}`" }
        "400": { description: "`invalid` : limite ou `never_played` invalide" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/albums/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: "Supprime l'album dans Lidarr avec ses fichiers et l'exclut (il ne revient pas seul), puis synchronise : ses pistes passent absentes"
      responses:
        "204": { description: "Supprimé" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
        "409": { description: "`not_in_lidarr`" }
        "502": { description: "`lidarr_unavailable` : rien n'est supprimé" }
  /admin/artists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: "Supprime l'artiste dans Lidarr avec ses fichiers et l'exclut, puis synchronise"
      responses:
        "204": { description: "Supprimé" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
        "409": { description: "`not_in_lidarr`" }
        "502": { description: "`lidarr_unavailable`" }
  /admin/analysis:
    get:
      summary: "Avancement de l'analyse audio et tâches en erreur"
      description: "`paused` : un transcodage de lecture est en cours, l'analyse attend. `loaded` : pistes dont le vecteur est en mémoire pour le calcul des voisins. Les erreurs ne portent ni chemin ni nom de fichier (200 au plus, les plus récentes)."
      responses:
        "200": { description: "`{version, parallel, paused, tasks: {pending, running, done, failed}, tracks, analysed, loaded, errors: [{track, title, error, attempts, at}]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/analysis/retry:
    post:
      summary: "Remet en file les analyses en erreur"
      responses:
        "202": { description: "`{requeued}` : nombre de tâches remises en file" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /tracks/{id}/similar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Pistes disponibles les plus proches à l'oreille (analyse audio), de la plus proche à la plus lointaine"
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: "`{items: [piste]}` au format des pistes de la bibliothèque ; liste vide tant que la piste n'est pas analysée" }
        "400": { description: "`invalid` : limite invalide" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
  /recommendations/dismiss:
    post:
      summary: "« Ne plus proposer » : la piste n'est plus suggérée à la personne ; si elle vient d'une découverte faite pour elle, son album n'est plus redemandé pour elle"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [track], properties: { track: { type: string, format: uuid } } }
      responses:
        "204": { description: "Enregistré (sans effet si déjà fait)" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : piste inconnue" }
  /admin/recommendations/explain:
    get:
      summary: "Détail du score d'une piste candidate pour une personne, dans le contexte de sa file (source et piste courante), pour régler les poids"
      parameters:
        - { name: track, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: sub, in: query, required: true, schema: { type: string, maxLength: 200 }, description: "identifiant de la personne" }
      responses:
        "200": { description: "`{track, sub, context: {tracks, previous, analysed}, excluded: null|in_source|unavailable|dismissed|discovery_of_another|skipped_recently, weights, signals, contributions, total, inputs}` ; `weights`, `signals` et `contributions` portent `audio, metadata, similarity, affinity, discovery, skips, recent_track, recent_artist` (`signals` aussi `total`) ; `inputs` : `{distance_context, distance_previous, shared_genres, year_gap, same_artist, artist_similarity, plays, skips, liked, artist_liked, in_playlist, distance_liked, discovery}`, `null` pour un signal absent (neutre)" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : piste inconnue" }
  /admin/discovery:
    get:
      summary: "Découverte automatique : budget, ajouts d'origine découverte et découvertes proposées à la suppression"
      responses:
        "200": { description: "`{enabled, budget: {used, limit, daily_limit, trial_days}, items: [ajout avec author, similar_to, track_title, size], removal_candidates: [{addition, album, size, author: {sub, name}, similar_to, track_title, skips, available_since}]}` ; `used` et `limit` en octets ; `similar_to` : nom de l'artiste écouté dont l'artiste ajouté est proche ; `removal_candidates` : albums de découverte jamais écoutés en entier après `SILLON_DECOUVERTE_ESSAI_JOURS` ou sautés 3 fois sans écoute complète, du plus gros au plus petit, à supprimer par `DELETE /admin/albums/{id}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
