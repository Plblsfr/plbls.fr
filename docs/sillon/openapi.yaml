openapi: 3.1.0
info:
  title: Sillon
  version: 0.1.0
  description: |
    Service de musique de plbls.fr : bibliothèque gérée par Lidarr, lecture, playlists, ajout de musique et recommandation.
    Ce document suit le code : chaque route de `api/sillon/src/routes.rs` y figure, et rien d'autre (vérifié par un test).

    Authentification : cookie de session du gateway (`__Secure-plbls_sid`) ou `Authorization: Bearer` (apps natives),
    vérifié par `GET /auth/me` du gateway. Droits : permissions aegis `sillon:access`, `sillon:add`, `sillon:admin`,
    fermées par défaut. Requêtes modifiantes avec cookie : `Origin` dans `SILLON_ALLOWED_ORIGINS`, sinon 403 `bad_origin`.
    Erreurs : `{"error": "<code>", "message": "…"}`.
servers:
  - url: https://sillon-api.plbls.fr
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Secure-plbls_sid
    bearer:
      type: http
      scheme: bearer
  responses:
    "401":
      description: "`unauthorized` : connexion requise"
    "403":
      description: "`forbidden` : permission manquante (le message la nomme)"
    "502":
      description: "`gateway_unavailable` : service de connexion injoignable"
    "503":
      description: "`aegis_unavailable` : service de droits injoignable (routes soumises à une permission)"
security:
  - session: []
  - bearer: []
paths:
  /healthz:
    get:
      summary: "Santé du processus"
      security: []
      responses:
        "200": { description: "`{status, version}`" }
  /readyz:
    get:
      summary: "Base joignable"
      security: []
      responses:
        "200": { description: "`{status: ready}`" }
        "503": { description: "`not_ready`" }
  /me:
    get:
      summary: "Identité, permissions et sections à afficher (aucune permission Sillon exigée)"
      description: |
        `sections` liste ce que la personne peut ouvrir, dans cet ordre : `library` (`sillon:access`), `add` (`sillon:add`),
        `admin` (`sillon:admin`) ; vide sans aucune permission Sillon. aegis injoignable : permissions toutes fausses, sections vides.
      responses:
        "200": { description: "`{sub, name, email, permissions: {access, add, admin}, sections: [string]}`" }
        "401": { $ref: "#/components/responses/401" }
        "502": { $ref: "#/components/responses/502" }
  /artists:
    get:
      summary: "Artistes présents, par nom (sans accents), pagination par curseur"
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: "`next_cursor` de la page précédente" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: genre, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        "200": { description: "`{items: [Artiste], next_cursor: string|null}`, Artiste : `{id, name, overview, genres, image, fanart, available, album_count}`" }
        "400": { description: "`invalid` : limite, curseur ou genre invalide" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /artists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Fiche artiste et tous ses albums (absents compris, `available: false`)"
      responses:
        "200": { description: "Artiste et `albums: [Album]`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
  /artists/{id}/image:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Image de l'artiste, téléchargée depuis Lidarr et mise en cache"
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [poster, fanart], default: poster } }
        - { name: size, in: query, schema: { type: string, enum: [small, medium, large], default: small } }
      responses:
        "200": { description: "Image (JPEG, PNG, GIF ou WebP)" }
        "400": { description: "`invalid` : type ou taille inconnus" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : artiste ou image absents" }
        "502": { description: "`lidarr_unavailable` : Lidarr injoignable et image jamais mise en cache" }
  /albums/recent:
    get:
      summary: "Ajouts récents : albums présents, du plus récemment arrivé au plus ancien, pagination par curseur"
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: "`{items: [Album], next_cursor}`, Album : `{id, title, type, secondary_types, release_date, year, genres, cover, available, added_at, track_count, duration, artist: {id, name}}`" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /albums/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Fiche album et ses pistes, par disque et numéro (absentes comprises, `available: false`)"
      responses:
        "200": { description: "Album et `tracks: [Piste]`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
  /albums/{id}/cover:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Pochette de l'album, téléchargée depuis Lidarr et mise en cache"
      parameters:
        - { name: size, in: query, schema: { type: string, enum: [small, medium, large], default: small } }
      responses:
        "200": { description: "Image" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
        "502": { description: "`lidarr_unavailable`" }
  /tracks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: "Piste, présente ou absente"
      responses:
        "200": { description: "Piste : `{id, title, disc, number, duration, explicit, available, album: {id, title, year, cover}, artist: {id, name}, format: {codec, container, bitrate, sample_rate, channels, bits}|null}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
  /genres:
    get:
      summary: "Genres portés par au moins un artiste ou un album présent"
      responses:
        "200": { description: "`{items: [{name, artist_count, album_count}]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /search:
    get:
      summary: "Recherche plein texte sans accents dans les artistes, albums et pistes présents"
      description: "Mots entiers (`to_tsvector` avec `unaccent`) ou sous-chaîne (`LIKE` échappé), sans tenir compte des accents ni de la casse."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 }, description: "par catégorie" }
      responses:
        "200": { description: "`{artists: [Artiste], albums: [Album], tracks: [Piste]}`" }
        "400": { description: "`invalid` : recherche vide ou trop longue" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/status:
    get:
      summary: "État des synchronisations et de la bibliothèque"
      responses:
        "200": { description: "`{sync: [{source, succeeded_at, attempted_at, error}], running, configured: {lidarr, webhook}, library: {artists, albums, tracks, absent_tracks, files, rejected, size}}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/rejected:
    get:
      summary: "Fichiers écartés (nom seul et raison)"
      description: "Raisons : `hors_medias`, `extension_interdite`, `double_extension`, `conteneur_incoherent`, `sans_flux_audio`, `nom_suspect`, `analyse_impossible`."
      responses:
        "200": { description: "`{items: [{name, reason, seen_at}]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/sync:
    post:
      summary: "Lance une synchronisation (relancée à la fin de celle en cours s'il y en a une)"
      responses:
        "202": { description: "`{started: true}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /webhooks/lidarr:
    post:
      summary: "Webhook de Lidarr : relance la synchronisation (sauf évènements Test, Grab, santé et mise à jour)"
      description: "Jeton `SILLON_WEBHOOK_TOKEN` en mot de passe du Basic auth (nom libre), en `Authorization: Bearer` ou en `?token=…`."
      security: []
      responses:
        "204": { description: "Reçu" }
        "401": { description: "`unauthorized` : jeton absent ou faux" }
        "404": { description: "`SILLON_WEBHOOK_TOKEN` vide : webhook coupé" }
  /additions/search:
    get:
      summary: "Recherche d'artistes et d'albums par la recherche de Lidarr (MusicBrainz), marqués présents, en cours ou exclus"
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        "200": { description: "`{artists: [{mbid, name, disambiguation, type, overview, in_library, in_progress, excluded}], albums: [{mbid, title, type, secondary_types, year, duration, artist: {mbid, name}, in_library, in_progress, excluded, estimated_size}]}` (20 au plus chacun)" }
        "400": { description: "`invalid` : recherche vide ou trop longue" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { description: "`lidarr_unavailable`" }
        "503": { description: "`not_configured` : Lidarr non configuré" }
  /additions:
    post:
      summary: "Ajoute un album (seul surveillé) ou un artiste (albums studio surveillés) : envoyé à Lidarr tout de suite, recherche lancée"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, mbid]
              properties:
                kind: { type: string, enum: [album, artist] }
                mbid: { type: string, format: uuid, description: "MBID MusicBrainz de l'album ou de l'artiste" }
      responses:
        "201": { description: "Ajout : `{id, kind, mbid, title, artist: {mbid, name}, origin: manual|discovery, state: sent|downloading|partial|available|failed|deleted, reason, estimated_size, albums: [uuid], created_at, updated_at}`" }
        "200": { description: "Ajout déjà en cours pour ce titre, avec `existing: true`" }
        "400": { description: "`invalid` : kind ou mbid invalide" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : inconnu de MusicBrainz" }
        "409": { description: "`already_available` (déjà dans la bibliothèque) ou `excluded` (retiré par un administrateur)" }
        "429": { description: "`daily_limit` : `SILLON_AJOUTS_PAR_JOUR` ajouts sur 24 heures glissantes" }
        "502": { description: "`lidarr_unavailable` : rien n'est enregistré" }
        "503": { description: "`not_configured` : Lidarr, dossier racine ou profils non configurés" }
        "507": { description: "`disk_full` : le plafond `SILLON_MEDIAS_GO` serait dépassé ; `{used, pending, limit, free, estimated}` ; rien n'est envoyé à Lidarr" }
  /additions/mine:
    get:
      summary: "Mes ajouts, du plus récent au plus ancien (200 au plus)"
      responses:
        "200": { description: "`{items: [Ajout]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/disk:
    get:
      summary: "Occupation du dossier de la musique et plafond"
      responses:
        "200": { description: "`{used, pending, limit, free, daily_limit, configured}` (octets ; `limit` et `free` nuls sans plafond)" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/additions:
    get:
      summary: "Ajouts de tous, avec leur auteur (500 au plus)"
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [sent, downloading, partial, available, failed, deleted] } }
      responses:
        "200": { description: "`{items: [Ajout et author: {sub, name}]}`" }
        "400": { description: "`invalid` : état inconnu" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/additions/{id}/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: "Relance un ajout en échec (plafond vérifié, recherche renvoyée à Lidarr)"
      responses:
        "201": { description: "Ajout relancé" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
        "409": { description: "`invalid_state` : l'ajout n'est pas en échec, ou le même titre est déjà en cours" }
        "502": { description: "`lidarr_unavailable` : l'ajout reste en échec" }
        "507": { description: "`disk_full`" }
  /admin/albums:
    get:
      summary: "Albums présents, du plus gros au plus petit"
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: "`{items: [Album et size, added_by]}`" }
        "400": { description: "`invalid`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
  /admin/albums/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: "Supprime l'album dans Lidarr avec ses fichiers et l'exclut (il ne revient pas seul), puis synchronise : ses pistes passent absentes"
      responses:
        "204": { description: "Supprimé" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
        "409": { description: "`not_in_lidarr`" }
        "502": { description: "`lidarr_unavailable` : rien n'est supprimé" }
  /admin/artists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: "Supprime l'artiste dans Lidarr avec ses fichiers et l'exclut, puis synchronise"
      responses:
        "204": { description: "Supprimé" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found`" }
        "409": { description: "`not_in_lidarr`" }
        "502": { description: "`lidarr_unavailable`" }
