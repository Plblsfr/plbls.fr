openapi: 3.0.3
info:
  title: Estompe API
  version: 0.1.0
  description: |
    API du service de chat Estompe (v0). Voir aussi `docs/realtime.md` pour les évènements WebSocket.

    **Authentification utilisateur** : identité Keycloak via auth-gateway. Le client envoie soit le cookie de
    session `__Secure-plbls_sid` (web, PWA), soit `Authorization: Bearer <access_token>` (Windows). Le service
    interroge `GET /auth/me` du gateway. Les requêtes modifiantes portant un cookie doivent avoir un `Origin`
    autorisé (sinon 403 `bad_origin`).

    **Permission** : l'accès à Estompe est accordé dans permission.plbls.fr (permission `estompe:access` par défaut,
    `PERMISSION_NAME`). Le service lit toutes les permissions du compte en un appel, `GET /v1/users/{sub}/permissions`,
    avec un Bearer de service (cache 30 s). Sans la permission,
    `/activate` et toutes les routes du chat répondent 403 `forbidden` (503 `permission_unavailable` si permission est injoignable).

    **Compte activé** : toutes les routes, sauf `/me`, `/activate` et `/ws`, répondent 403 `not_activated`
    tant que l'utilisateur n'a pas choisi son pseudo (`POST /activate`).

    **Version du client** : les apps envoient `X-Estompe-Version` (x.y.z) et `X-Estompe-Platform` (`web`, `pwa`, `windows`,
    `android`) ; à l'ouverture du WebSocket, les paramètres `v` et `platform`. Si la version est inférieure au minimum de la
    plateforme (`backend/core/updates.json`), toute route répond 426 `upgrade_required`
    (`{error, message, min_version}`) et l'app affiche l'écran « Mise à jour requise ». Sans en-tête, la requête passe.

    **Erreurs** : `{"error": "<code>", "message": "<texte>"}`. Un non-membre qui vise un serveur, un salon, un message
    ou un fichier reçoit 404 (on ne révèle pas leur existence). Les identifiants de message sont des entiers
    sérialisés en chaînes ; les autres sont des UUID.
servers:
  - url: https://chat.plbls.fr
security:
  - bearer: []
  - session: []
tags:
  - name: compte
  - name: serveurs
  - name: messages
  - name: fichiers
  - name: vocal
  - name: vidéos
  - name: temps réel
  - name: films
paths:
  /healthz:
    get: {summary: Liveness, security: [], responses: {"200": {description: ok}}}
  /readyz:
    get: {summary: Readiness (base de données), security: [], responses: {"200": {description: ok}, "503": {description: Base injoignable}}}

  /me:
    get:
      tags: [compte]
      summary: État du compte Estompe de l'utilisateur connecté
      responses:
        "200":
          description: "`allowed: false` sans la permission d'utiliser Estompe ; `activated: false` tant que le pseudo n'est pas choisi"
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: {type: boolean}
                  admin: {type: boolean, description: "au moins une permission `estompe:admin.*` (tableau de bord d'administration)"}
                  rights: {type: array, items: {type: string, enum: [access, admin, movies, permissions, acces, users]}, description: "droits du compte : `access` (`estompe:access`), `admin` (une permission `estompe:admin.*`), `movies` (`estompe:films.use` et Jellyfin configuré), `acces` (administration des accès d'aegis : `aegis:admin` ou rôle Keycloak `AEGIS_ADMIN_ROLE`, avec `AEGIS_URL`), `permissions` (ancien service permission, sans `AEGIS_URL`), `users` (recherche de comptes). Présent même sans compte activé"}
                  capabilities: {type: object, additionalProperties: {type: object, properties: {allow: {type: array, items: {type: string}}, deny: {type: array, items: {type: string}}}}, description: "permissions `estompe:*` accordées : ressources autorisées (`*` = tous les serveurs) et refusées. Confort d'affichage ; le contrôle se fait côté API"}
                  activated: {type: boolean}
                  movies: {type: boolean, description: "permission `estompe:films.use` et Jellyfin configuré : accès à l'onglet Films et séries"}
                  max_video_size: {type: integer, description: "taille maximale d'une vidéo en octets (`MAX_VIDEO_SIZE_MB`, 100 Mo par défaut)"}
                  transcription: {type: string, enum: ["", alpha, "on"], description: "transcription des messages vocaux : désactivée (`TRANSCRIBE_URL` vide), `alpha` (`TRANSCRIBE_ALPHA`, défaut : réservée aux fonctions alpha débloquées côté client) ou `on` pour tous"}
                  blocks: {type: array, items: {type: string}, description: "blocs actifs du backend (variables `BLOCK_<NOM>=false` pour en désactiver) : un bloc absent n'a pas ses routes"}
                  sub: {type: string, description: "identifiant du compte dans le gateway"}
                  id: {type: string, format: uuid}
                  pseudo: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /activate:
    post:
      tags: [compte]
      summary: Créer le compte Estompe (pseudo), réservé aux détenteurs de la permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pseudo]
              properties:
                pseudo: {type: string, pattern: '^[A-Za-z0-9_.-]{3,20}$'}
      responses:
        "201": {description: Compte créé, content: {application/json: {schema: {$ref: "#/components/schemas/Person"}}}}
        "400": {description: "`invalid_pseudo`", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: "`forbidden` : permission non accordée", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: "`pseudo_taken` ou `already_activated`", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /notifications:
    get:
      tags: [messages]
      summary: Mentions non lues (200 max, récentes d'abord)
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Mention"}}}}}
        "403": {$ref: "#/components/responses/NotActivated"}
  /notifications/read:
    post:
      tags: [messages]
      summary: Marquer des mentions comme lues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_ids: {type: array, items: {type: string}, description: Vide ou absent = toutes}
      responses:
        "204": {description: ok}

  /unread:
    get:
      tags: [messages]
      summary: Conversations contenant des messages non lus
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, properties: {channels: {type: array, items: {type: string}}, dms: {type: array, items: {type: string}}, counts: {type: object, additionalProperties: {type: integer}}}}}}}
  /channels/{cid}/read:
    post:
      tags: [messages]
      summary: Marquer un salon texte comme lu (ses mentions sont lues avec lui)
      parameters: [{name: cid, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: ok}
        "404": {description: introuvable}
  /dms/{id}/read:
    post:
      tags: [messages]
      summary: Marquer une conversation privée comme lue (ses mentions sont lues avec elle)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: ok}
        "404": {description: introuvable}
  /channels/{cid}/reads:
    get:
      tags: [messages]
      summary: Dernier message vu par chaque membre d'un salon texte
      parameters: [{name: cid, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: "liste de {user_id, pseudo, last_id, read_at}", content: {application/json: {schema: {type: array, items: {type: object, properties: {user_id: {type: string}, pseudo: {type: string}, last_id: {type: string}, read_at: {type: string, format: date-time}}}}}}}
        "404": {description: introuvable}
  /dms/{id}/reads:
    get:
      tags: [messages]
      summary: Dernier message vu par chaque personne d'une conversation privée
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: "liste de {user_id, pseudo, last_id, read_at}", content: {application/json: {schema: {type: array, items: {type: object, properties: {user_id: {type: string}, pseudo: {type: string}, last_id: {type: string}, read_at: {type: string, format: date-time}}}}}}}
        "404": {description: introuvable}
  /avatars:
    get:
      tags: [comptes]
      summary: Versions d'avatar des personnes côtoyées (même serveur ou message privé), soi-même compris
      responses:
        "200": {description: "ok — {user_id: version}", content: {application/json: {schema: {type: object, additionalProperties: {type: integer}}}}}
  /me/avatar:
    put:
      tags: [comptes]
      summary: Définir son avatar (PNG ou JPEG, 256 Ko et 512 px au plus)
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
      responses:
        "204": {description: ok (évènement `avatar.updated`)}
        "400": {description: invalid_image}
        "413": {description: too_large}
    delete:
      tags: [comptes]
      summary: Supprimer son avatar
      responses:
        "204": {description: ok}
  /me/camera-background:
    put:
      tags: [comptes]
      summary: Définir son fond de caméra personnalisé (PNG ou JPEG, 1 Mo et 1920 px au plus)
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
      responses:
        "204": {description: ok}
        "400": {description: invalid_image}
        "413": {description: too_large}
    get:
      tags: [comptes]
      summary: Son fond de caméra personnalisé (visible de soi seul)
      responses:
        "200": {description: image, content: {image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}}}
        "404": {description: aucun fond enregistré}
    delete:
      tags: [comptes]
      summary: Supprimer son fond de caméra personnalisé
      responses:
        "204": {description: ok}
  /users/{id}/avatar:
    get:
      tags: [comptes]
      summary: Image d'avatar d'une personne côtoyée
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: image, content: {image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}}}
        "404": {description: pas d'avatar, ou personne non côtoyée}
  /push/key:
    get:
      tags: [comptes]
      summary: Clé publique VAPID pour s'abonner aux notifications push
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, properties: {public_key: {type: string}}}}}}
        "501": {description: no_push (VAPID non configuré)}
  /push/fcm:
    put:
      tags: [comptes]
      summary: Enregistrer le jeton FCM de l'app Android
      description: "Le service de notifications (réglages de la personne, aucun envoi si elle est active ailleurs) envoie des messages FCM « data » seuls : title, body, tag, url, conv, msg, kind (dm, mention, channel, voice), silent, et sender, room, text, attach (image ou file) quand l'aperçu n'est pas masqué. L'app construit la notification (canal par kind, fil MessagingStyle par conversation pour Android Auto, actions Répondre / Marquer comme lu) et le mode conduite lit sender, room, text, attach."
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [token], properties: {token: {type: string, maxLength: 512}, previous: {type: string, maxLength: 512, description: "ancien jeton (rotation) : retiré dans le même appel"}}}}}
      responses:
        "204": {description: ok}
        "400": {description: invalid_subscription}
        "501": {description: no_push (FCM_SERVICE_ACCOUNT non configuré)}
    delete:
      tags: [comptes]
      summary: Supprimer le jeton FCM de cet appareil
      requestBody:
        content: {application/json: {schema: {type: object, properties: {token: {type: string}}}}}
      responses:
        "204": {description: ok}
  /push/desktop:
    put:
      tags: [comptes]
      summary: Enregistrer l'installation de l'app Windows
      description: "L'app PC notifie localement : le serveur ne lui envoie aucune notification push. L'enregistrement sert à connaître les appareils de la personne."
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string, maxLength: 128}}}}}
      responses:
        "204": {description: ok}
        "400": {description: invalid_subscription}
    delete:
      tags: [comptes]
      summary: Retirer cette installation (à la déconnexion)
      requestBody:
        content: {application/json: {schema: {type: object, properties: {id: {type: string}}}}}
      responses:
        "204": {description: ok}
  /push/test:
    post:
      tags: [comptes]
      summary: Envoyer une notification de test aux abonnements Web Push du compte
      responses:
        "204": {description: "ok — au moins un envoi accepté par le service de push"}
        "404": {description: no_subscription}
        "501": {description: no_push}
        "502": {description: "push_failed — message = réponse du service de push"}
  /push/subscription:
    put:
      tags: [comptes]
      summary: Enregistrer l'abonnement push de ce navigateur (PushSubscription.toJSON())
      description: "Une notification est envoyée aux destinataires hors ligne (aucun WebSocket ouvert) pour une mention ou un message privé."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: {type: string, description: URL https}
                keys: {type: object, properties: {p256dh: {type: string}, auth: {type: string}}}
      responses:
        "204": {description: ok}
        "400": {description: invalid_subscription}
        "501": {description: no_push}
    delete:
      tags: [comptes]
      summary: Supprimer l'abonnement push de ce navigateur
      requestBody:
        content: {application/json: {schema: {type: object, properties: {endpoint: {type: string}}}}}
      responses:
        "204": {description: ok}

  /channels/{cid}/pins:
    get:
      tags: [messages]
      summary: Messages épinglés d'un salon (les plus récemment épinglés d'abord)
      parameters: [{name: cid, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: "ok — {messages: [...]}"}
  /dms/{id}/pins:
    get:
      tags: [messages]
      summary: Messages épinglés d'une conversation privée
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: "ok — {messages: [...]}"}
  /search:
    get:
      tags: [messages]
      summary: Rechercher des messages dans tous les salons visibles et les messages privés de l'utilisateur
      description: |
        Plein texte PostgreSQL en français (sans tenir compte des accents ni de la casse, racines des mots, mots vides ignorés).
        `q` (200 caractères au plus) mêle texte et filtres : `"expression exacte"`, `-exclu`, `de:pseudo`, `dans:#salon`, `serveur:nom` (contient),
        `mentionne:pseudo`, `avant:AAAA-MM-JJ`, `après:AAAA-MM-JJ`, `pendant:AAAA-MM-JJ` (jours en UTC), `a:fichier|image|vidéo|lien|sondage`, `épinglé:oui`
        (valeur avec espaces entre guillemets : `serveur:"Mon serveur"`). Les filtres se combinent ; le texte seul demande 2 caractères, une saisie composée de filtres seuls est permise.
        Les droits sont recalculés à chaque recherche (permissions et exceptions par salon) ; un message supprimé n'apparaît plus, un message modifié suit son nouveau texte.
        Portée : `server_id`, `channel_id` ou `dm_id` (un seul ; rien : partout) ; une portée inaccessible ne donne aucun résultat.
        Tri `date` (défaut, du plus récent au plus ancien) ou `relevance` (parmi les 2000 correspondances les plus récentes). 30 recherches par minute, comptées dans `estompe_search_duration_seconds` (`GET /metrics`).
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, maxLength: 200}}
        - {name: server_id, in: query, schema: {type: string}}
        - {name: channel_id, in: query, schema: {type: string}}
        - {name: dm_id, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [date, relevance]}}
        - {name: before, in: query, description: "seulement les messages d'identifiant inférieur", schema: {type: string}}
        - {name: offset, in: query, description: "0 à 1000, pour les pages suivantes", schema: {type: integer}}
        - {name: limit, in: query, description: "1 à 50, 25 par défaut", schema: {type: integer}}
      responses:
        "200": {description: "ok — {messages, has_more}"}
        "400": {description: "invalid_query (saisie vide, texte d'un caractère, date illisible, a: inconnu) ou paramètre invalide"}
        "429": {description: too_many_requests}
  /channels/{cid}/search:
    get:
      tags: [messages]
      summary: Rechercher dans un salon (comme `GET /search` limité à ce salon)
      parameters: [{name: cid, in: path, required: true, schema: {type: string}}, {name: q, in: query, required: true, schema: {type: string}}, {name: sort, in: query, schema: {type: string}}, {name: before, in: query, schema: {type: string}}, {name: offset, in: query, schema: {type: integer}}, {name: limit, in: query, schema: {type: integer}}]
      responses:
        "200": {description: "ok — {messages, has_more}"}
        "400": {description: invalid_query}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {description: too_many_requests}
  /dms/{id}/search:
    get:
      tags: [messages]
      summary: Rechercher dans une conversation privée (comme `GET /search` limité à cette conversation)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: q, in: query, required: true, schema: {type: string}}, {name: sort, in: query, schema: {type: string}}, {name: before, in: query, schema: {type: string}}, {name: offset, in: query, schema: {type: integer}}, {name: limit, in: query, schema: {type: integer}}]
      responses:
        "200": {description: "ok — {messages, has_more}"}
        "400": {description: invalid_query}
        "404": {$ref: "#/components/responses/NotFound"}
  /channels/{cid}/typing:
    post:
      tags: [messages]
      summary: Signaler que l'on écrit (évènement `typing` aux autres participants, 2 par 3 secondes au plus)
      parameters: [{name: cid, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: ok}
  /dms/{id}/typing:
    post:
      tags: [messages]
      summary: Signaler que l'on écrit dans une conversation privée
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: ok}
  /messages/{id}/pin:
    put:
      tags: [messages]
      summary: Épingler un message (tout participant ; évènement `message.updated`, champ `pinned_at`)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: ok}
    delete:
      tags: [messages]
      summary: Désépingler un message
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: ok}
  /emojis:
    get:
      tags: [serveurs]
      summary: Emojis personnalisés de tous les serveurs de l'utilisateur
      responses:
        "200": {description: "ok — [{id, server_id, name, created_by}]"}
  /servers/{id}/emojis:
    post:
      tags: [serveurs]
      summary: Ajouter un emoji (corps = image PNG, JPEG ou GIF de 256 px et 128 Ko au plus ; ?name=2 à 32 caractères a-z 0-9 _)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: name, in: query, required: true, schema: {type: string}}]
      responses:
        "201": {description: ok (évènement `emoji.updated`)}
        "400": {description: invalid_name ou invalid_image}
        "404": {description: serveur introuvable}
        "409": {description: emoji_taken ou too_many_emojis (50 par serveur)}
        "413": {description: too_large (128 Ko au plus)}
  /servers/{id}/emojis/{eid}:
    patch:
      tags: [serveurs]
      summary: Renommer un emoji (créateur du serveur ou auteur de l'emoji)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: eid, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {name: {type: string, pattern: "^[a-z0-9_]{2,32}$"}}}}}
      responses:
        "204": {description: ok (évènement `emoji.updated`)}
        "400": {description: invalid_name}
        "404": {description: introuvable ou non modifiable}
        "409": {description: emoji_taken}
    delete:
      tags: [serveurs]
      summary: Supprimer un emoji (créateur du serveur ou auteur de l'emoji)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: eid, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: ok (évènement `emoji.updated`)}
        "404": {description: introuvable ou non modifiable}
  /emojis/{eid}/image:
    get:
      tags: [serveurs]
      summary: Image d'un emoji (membres du serveur)
      parameters: [{name: eid, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: image}
  /gifs/search:
    get:
      tags: [messages]
      summary: Rechercher un GIF (Giphy, par le serveur) ; `q` de 1 à 100 caractères, `offset` de 0 à 480 (sinon 0), 24 résultats, 30 requêtes par minute et par utilisateur
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: offset, in: query, required: false, schema: {type: integer}}
      responses:
        "200": {description: "ok — [{id, title, preview, url, width, height}]"}
        "400": {description: invalid_query}
        "429": {description: too_many_requests (en-tête Retry-After)}
        "501": {description: no_gifs (GIPHY_API_KEY absente)}
        "502": {description: gif_unavailable (Giphy injoignable)}
  /gifs/trending:
    get:
      tags: [messages]
      summary: GIF du moment (Giphy, par le serveur), mêmes limites que la recherche
      parameters:
        - {name: offset, in: query, required: false, schema: {type: integer}}
      responses:
        "200": {description: "ok — [{id, title, preview, url, width, height}]"}
        "429": {description: too_many_requests (en-tête Retry-After)}
        "501": {description: no_gifs (GIPHY_API_KEY absente)}
        "502": {description: gif_unavailable (Giphy injoignable)}
  /gifs/import:
    post:
      tags: [messages]
      summary: Copier un GIF choisi comme fichier en attente (à joindre avec file_ids) ; seuls les hôtes media*.giphy.com en https sont acceptés
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {url: {type: string}}}}}
      responses:
        "201": {description: "ok — pièce jointe"}
        "400": {description: bad_request ou invalid_url}
        "429": {description: too_many_pending_files ou quota}
        "501": {description: no_gifs (GIPHY_API_KEY absente)}
        "502": {description: gif_unavailable (GIF indisponible)}
  /admin/live:
    get:
      tags: [administration]
      summary: "Activité en direct : connexions temps réel, appareils connectés (pseudo, plateforme, version), salons vocaux actifs et leurs participants. Permission `estompe:admin`"
      responses:
        "200": {description: "ok — {connections, online: [{pseudo, platform, version}], voice: [{server, channel, participants}]}"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: forbidden (sans la permission estompe:admin)}
  /users/{id}/badges:
    get:
      tags: [compte]
      summary: "Badges d'un utilisateur affichés dans son profil ; liste vide si l'on ne partage ni serveur ni message privé avec lui"
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: "ok — [{id, name, icon, color, description, icon_version, sort_order, created_at}] ; `icon_version` 0 : emoji `icon`, sinon image `GET /badges/{id}/icon`"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /admin/badges:
    get:
      tags: [administration]
      summary: "Badges et pseudos qui les portent. Permission `estompe:admin`"
      responses:
        "200": {description: "ok — [{id, name, icon, color, description, icon_version, sort_order, created_at, holders: [{id, pseudo}]}], triés par ordre d'affichage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: forbidden}
    post:
      tags: [administration]
      summary: "Crée un badge : nom (2 à 32), couleur `#rrggbb`, description (200 au plus), ordre d'affichage (0 à 9999), emoji de repli `icon` (facultatif, 🏅 par défaut) ; l'image se règle ensuite avec `PUT /admin/badges/{id}/icon`. Journalisé. Permission `estompe:admin`"
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, color], properties: {name: {type: string}, icon: {type: string}, color: {type: string}, description: {type: string}, sort_order: {type: integer}}}}}
      responses:
        "201": {description: "ok — le badge"}
        "400": {description: invalid_name / invalid_icon / invalid_color / invalid_description / invalid_order}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: forbidden}
        "409": {description: badge_exists}
  /admin/badges/{id}:
    put:
      tags: [administration]
      summary: "Modifie nom, couleur, description et ordre d'affichage (mêmes champs et contrôles que la création). Journalisé. Permission `estompe:admin`"
      responses:
        "200": {description: "ok — le badge"}
        "400": {description: invalid_name / invalid_color / invalid_description / invalid_order}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: forbidden}
        "404": {description: not_found}
        "409": {description: badge_exists}
    delete:
      tags: [administration]
      summary: "Supprime le badge et le retire à tous. Permission `estompe:admin`"
      responses:
        "204": {description: ok}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: forbidden}
        "404": {description: not_found}
  /admin/badges/{id}/icon:
    put:
      tags: [administration]
      summary: "Remplace l'image du badge ; corps = le fichier, `Content-Type` = son type. SVG (64 Ko au plus, nettoyé : scripts, `on*`, `foreignObject`, liens externes supprimés ; `viewBox` requis), WebP fixe, PNG ou JPEG (256 Ko, 512 px au plus). Journalisé. Permission `estompe:admin`"
      requestBody:
        required: true
        content: {image/svg+xml: {}, image/webp: {}, image/png: {}, image/jpeg: {}}
      responses:
        "204": {description: ok}
        "400": {description: invalid_image}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: forbidden}
        "404": {description: not_found}
        "413": {description: too_large}
    delete:
      tags: [administration]
      summary: "Supprime l'image du badge (l'emoji s'affiche à nouveau). Permission `estompe:admin`"
      responses:
        "204": {description: ok}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: forbidden}
        "404": {description: not_found}
