        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : commerçant inconnu ou d'une autre personne" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
    patch:
      summary: "Renommer un commerçant (`tirelire:access`)"
      description: "Corps `{name}` : 1 à 80 caractères."
      responses:
        "200": { description: "`{merchant: Commercant}`" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
