openapi: 3.1.0
info:
  title: Tirelire
  version: 0.1.0
  description: |
    Suivi des comptes bancaires de plbls.fr : import des relevés de compte PDF du Crédit Mutuel de Bretagne, relevés et opérations,
    catégories, règles de classement, commerçants et statistiques par période.
    Ce document suit le code : chaque route de `api/tirelire/src/routes.rs` y figure, et rien d'autre (vérifié par un test).

    Authentification : cookie de session du gateway (`__Secure-plbls_sid`) ou `Authorization: Bearer` (apps natives),
    vérifié par `GET /auth/me` du gateway. Droits : permission aegis `tirelire:access`, fermée par défaut.
    Requêtes modifiantes avec cookie : `Origin` dans `TIRELIRE_ALLOWED_ORIGINS`, sinon 403 `bad_origin`.
    Erreurs : `{"error": "<code>", "message": "…"}`.

    Chaque personne ne lit et ne modifie que ses propres comptes, relevés, opérations, catégories, règles et commerçants : un
    identifiant d'une autre personne répond 404 dans un chemin, 400 dans un corps. Les montants sont des entiers en centimes ; les
    dates sont au format `AAAA-MM-JJ`.

    Classement : une opération prend, dans l'ordre, la catégorie choisie pour elle seule (`category_source: operation`), celle de
    son commerçant (`commercant`), celle de la première règle qui lui convient (`regle`), sinon aucune (« à classer »). Tout
    changement de règle, de commerçant ou de regroupement rejoue ce classement sur toutes les opérations de la personne, dans la
    même transaction ; `reclassified` donne le nombre d'opérations dont le classement a changé. Les catégories et les règles par
    défaut sont créées au premier accès de la personne.
servers:
  - url: https://tirelire-api.plbls.fr
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Secure-plbls_sid
    bearer:
      type: http
      scheme: bearer
  schemas:
    Operation:
      description: |
        `{id, statement_id, account_id, date, value_date, purchase_date, section, type, label, details, merchant, amount, direction,
        merchant_id, merchant_name, category_id, category_source, rule_id}`.
        `section` : titre de la section du relevé (`VIREMENTS RECUS`, `PAIEMENTS PAR CARTE`…) ; `type` : `carte`, `prelevement`,
        `virement`, `virement_instantane`, `echeance_pret`, `cotisation` ou `autre` ; `label` : libellé brut ; `details` : lignes
        de détail ; `purchase_date` et `merchant` (commerçant et ville bruts) : paiements par carte seulement ; `amount` : centimes,
        toujours positif ; `direction` : `debit` ou `credit` ; `merchant_id` et `merchant_name` : commerçant ou tiers déduit du
        libellé (`null` si rien n'a pu en être déduit) ; `category_id` : `null` tant que l'opération est à classer ;
        `category_source` : `operation`, `commercant`, `regle` ou `null` ; `rule_id` : règle appliquée quand la source est `regle`.
      type: object
    Categorie:
      description: |
        `{id, key, name, kind, monthly_cap, color, position, archived, operations, merchants, rules}`. `key` : clé d'une catégorie
        par défaut (`logement`, `credit`, `assurances`, `telecom`, `energie`, `abonnements`, `frais`, `courses`, `restaurants`,
        `transports`, `sante`, `loisirs`, `shopping`, `divers`, `epargne`, `revenus`, `transferts`), `null` pour une catégorie créée ;
        `kind` : `fixe`, `variable` (dépenses), `epargne`, `revenu` ou `neutre` (transfert sans effet) ; `monthly_cap` : plafond mensuel
        en centimes ou `null` ; `color` : rang de la teinte, stable ; `operations`, `merchants`, `rules` : nombres d'opérations classées,
        de commerçants et de règles qui la désignent.
      type: object
    Regle:
      description: |
        `{id, key, keywords, type, section, category_id, position, operations}`. Une règle convient à une opération quand son type est
        `type` (si donné), que le titre de sa section est `section` (si donné) et que son libellé contient l'un des `keywords` (s'il y en a),
        en mots entiers, sans tenir compte de la casse, des accents ni de la ponctuation. `position` : rang, 0 en premier ; la première
        règle qui convient l'emporte. `key` : clé d'une règle par défaut, sinon `null`. `operations` : opérations classées par cette règle.
      type: object
    Commercant:
      description: |
        `{id, name, category_id, operations, debits, credits, last_date, variants}`, et `variant_list: [{key, manual, operations}]` dans un
        détail. `category_id` : catégorie de tout le commerçant, prioritaire sur les règles, ou `null` ; `variants` : nombre de libellés
        normalisés regroupés ; `key` : libellé normalisé (majuscules, sans accent ni ponctuation, sans numéro de magasin ou de terminal,
        sans forme juridique) ; `manual` : variante rattachée par une fusion ou une séparation.
      type: object
    Periode:
      description: |
        `{id, from, to, days, known_through, elapsed_days, complete, open, statement_ids}`. `id` : `AAAA-MM` en mode `calendar`, date
        d'arrêté `AAAA-MM-JJ` en mode `statement`. `from`, `to` : premier et dernier jour du mois, ou date de l'ancien solde et date
        d'arrêté du relevé ; `days` : nombre de jours de la période. `complete` : les relevés importés couvrent toute la période
        (toujours vrai en mode `statement`). `open` : la période dépasse la date d'arrêté du dernier relevé importé ; `known_through`
        est alors cette date et `elapsed_days` le nombre de jours connus, sinon la fin et la durée de la période.
      type: object
    Ecart:
      description: |
        `{amount, delta, delta_bp}` : montant de la référence en centimes, écart de la période par rapport à elle, et cet écart en
        points de base de la référence (1 % = 100), `null` si la référence est nulle ou négative. Une moyenne ajoute `periods`,
        le nombre de périodes complètes qui la composent.
      type: object
    LigneCategorie:
      description: |
        `{id, name, kind, color, archived, monthly_cap, amount, operations, share_bp, previous, avg3, avg12, cap_delta, cap_bp, trend}`.
        `amount` : débits moins crédits de la catégorie sur la période (crédits moins débits pour `revenu` et `neutre`) ; `share_bp` :
        part des dépenses en points de base (`null` hors dépenses) ; `previous` : Ecart avec la période précédente ; `avg3`, `avg12` :
        Ecart avec la moyenne des 3 et des 12 dernières périodes complètes ; `cap_delta` : `amount` moins le plafond ; `cap_bp` :
        `amount` en points de base du plafond ; `trend` : montants des 12 dernières périodes, celle-ci en dernier.
      type: object
  parameters:
    mode:
      name: mode
      in: query
      description: "`calendar` : mois calendaires ; `statement` : une période par relevé, de la date de l'ancien solde à la date d'arrêté"
      schema: { type: string, enum: [calendar, statement], default: calendar }
    period: { name: period, in: query, description: "Identifiant de la période (`AAAA-MM` ou date d'arrêté `AAAA-MM-JJ`) ; absent : la plus récente", schema: { type: string } }
    date: { name: date, in: query, description: "Date à laquelle `from` et `to` s'appliquent : `operation`, ou `purchase` (date d'achat d'un paiement par carte, sinon date d'opération), comme les statistiques en mode `calendar`", schema: { type: string, enum: [operation, purchase], default: operation } }
    statement: { name: statement, in: query, description: "Identifiant d'un relevé", schema: { type: integer } }
    from: { name: from, in: query, description: "Date d'opération minimale, incluse", schema: { type: string, format: date } }
    to: { name: to, in: query, description: "Date d'opération maximale, incluse", schema: { type: string, format: date } }
    category: { name: category, in: query, description: "Identifiant d'une catégorie", schema: { type: integer } }
    merchant: { name: merchant, in: query, description: "Identifiant d'un commerçant", schema: { type: integer } }
    unclassified: { name: unclassified, in: query, description: "`true` : seulement les opérations sans catégorie", schema: { type: boolean, default: false } }
    q:
      name: q
      in: query
      description: "Recherche dans le libellé, les détails, le commerçant lu sur le relevé et le nom du commerçant, sans tenir compte de la casse ni des accents ; chaque mot doit s'y trouver ; `%` et `_` sont cherchés tels quels"
      schema: { type: string, maxLength: 100 }
    min: { name: min, in: query, description: "Montant minimal en centimes, inclus (valeur absolue, débit ou crédit)", schema: { type: integer, minimum: 0 } }
    max: { name: max, in: query, description: "Montant maximal en centimes, inclus ; au moins `min`", schema: { type: integer, minimum: 0 } }
    direction: { name: direction, in: query, description: "Sens de l'opération", schema: { type: string, enum: [debit, credit] } }
    type: { name: type, in: query, description: "Type d'opération", schema: { type: string, enum: [carte, prelevement, virement, virement_instantane, echeance_pret, cotisation, autre] } }
  responses:
    "400":
      description: "`invalid` : corps ou paramètre illisible (le message dit lequel)"
    "401":
      description: "`unauthorized` : connexion requise"
    "403":
      description: "`forbidden` : permission manquante (le message la nomme) ; `bad_origin` : origine non autorisée"
    "502":
      description: "`gateway_unavailable` : service de connexion injoignable"
    "503":
      description: "`aegis_unavailable` : service de droits injoignable"
security:
  - session: []
  - bearer: []
paths:
  /healthz:
    get:
      summary: "Santé du processus"
      security: []
      responses:
        "200": { description: "`{status, version}`" }
  /readyz:
    get:
      summary: "Base joignable"
      security: []
      responses:
        "200": { description: "`{status: ready}`" }
        "503": { description: "`not_ready`" }
  /me:
    get:
      summary: "Identité et permissions (aucune permission exigée)"
      description: "aegis injoignable : `access` faux."
      responses:
        "200": { description: "`{sub, name, email, permissions: {access}}`" }
        "401": { $ref: "#/components/responses/401" }
        "502": { $ref: "#/components/responses/502" }
  /accounts:
    get:
      summary: "Comptes de la personne (`tirelire:access`)"
      description: "Un compte est créé à l'import de son premier relevé (identifié par son IBAN) et supprimé avec son dernier relevé."
      responses:
        "200": { description: "`{accounts: [{id, bank, iban, bic, number, reference, holder, statements}]}` ; `bank` : `cmb` ; `statements` : nombre de relevés" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /statements:
    get:
      summary: "Relevés de la personne, du plus récent au plus ancien (`tirelire:access`)"
      responses:
        "200":
          description: |
            `{statements: [statement]}`. `statement` : `{id, account_id, number, year, from, to, old_balance, new_balance,
            total_debits, total_credits, operations, pages, sha256, checks, imported_at}`.
            `from` : date de l'ancien solde ; `to` : date d'arrêté ; soldes négatifs si débiteurs ; `operations` : nombre d'opérations ;
            `checks` : rapport du contrôle `{total_debits: {expected, read}, total_credits: {expected, read}, new_balance: {expected, read}, operations, unrecognized_lines}`.
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /statements/import:
    post:
      summary: "Importer un ou plusieurs relevés PDF (`tirelire:access`)"
      description: |
        Corps `multipart/form-data`, un champ `file` par PDF (24 au plus, 8 Mo par fichier, 32 Mo par envoi).
        Chaque fichier est traité indépendamment des autres ; la réponse est 200 dès que l'envoi est lisible, avec un résultat par fichier, dans l'ordre :
        - `{file, status: "imported", statement}` : relevé enregistré avec ses opérations ;
        - `{file, status: "already_imported", statement}` : même fichier (empreinte SHA-256) ou même relevé (compte, numéro, année, date d'arrêté) déjà importé, rien n'est modifié ;
        - `{file, status: "rejected", error: {code, message, …}}` : rien n'est enregistré. Codes : `not_a_pdf`, `unreadable_pdf`, `too_large`,
          `unknown_format` (ce n'est pas un relevé du Crédit Mutuel de Bretagne), `conflict` (même relevé en cours d'import), `checks_failed`.

        `checks_failed` ajoute `missing` (éléments absents : numéro du relevé, date d'arrêté, IBAN, soldes, totaux, en-tête du tableau),
        `gaps: [{check, expected, read}]` (`check` : `total_debits`, `total_credits` ou `new_balance`, en centimes) et
        `unrecognized_lines: [{page, text}]`. Un relevé n'est accepté que si la somme des débits et celle des crédits lus égalent les
        totaux du relevé, si l'ancien solde plus les mouvements donne le nouveau solde et si aucune ligne du tableau n'est restée non reconnue.
        Le PDF n'est pas conservé.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: array, items: { type: string, format: binary } }
      responses:
        "200": { description: "`{results: [{file, status, statement?, error?}]}`" }
        "400": { description: "`invalid` : corps illisible, aucun champ `file`, ou plus de 24 fichiers" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "413": { description: "`too_large` : envoi de plus de 32 Mo" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /statements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      summary: "Supprimer un relevé et ses opérations (`tirelire:access`)"
      description: "Le compte est supprimé avec son dernier relevé. Le même PDF peut ensuite être importé de nouveau."
      responses:
        "204": { description: "supprimé" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : relevé inconnu ou d'une autre personne" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /operations:
    get:
      summary: "Opérations de la personne, de la plus récente à la plus ancienne (`tirelire:access`)"
      description: |
        Les filtres se combinent (ET). `total`, `total_debits` et `total_credits` portent sur toute la sélection, pas sur la page rendue.
      parameters:
        - { $ref: "#/components/parameters/statement" }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { $ref: "#/components/parameters/category" }
        - { $ref: "#/components/parameters/merchant" }
        - { $ref: "#/components/parameters/unclassified" }
        - { $ref: "#/components/parameters/q" }
        - { $ref: "#/components/parameters/min" }
        - { $ref: "#/components/parameters/max" }
        - { $ref: "#/components/parameters/direction" }
        - { $ref: "#/components/parameters/type" }
        - { $ref: "#/components/parameters/date" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: "`{operations: [Operation], total, total_debits, total_credits, limit, offset}` ; `total` : nombre d'opérations qui répondent aux filtres, `total_debits` et `total_credits` : leurs sommes en centimes" }
        "400": { description: "`invalid` : filtre ou pagination illisible" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /operations/export.csv:
    get:
      summary: "Export CSV des opérations qui répondent aux filtres, sans pagination (`tirelire:access`)"
      description: |
        Mêmes filtres que `GET /operations`, toutes les lignes, de la plus récente à la plus ancienne, envoyées en flux.
        CSV pour un tableur français : UTF-8 avec BOM, séparateur `;`, fins de ligne CRLF, dates `JJ/MM/AAAA`, montants à virgule
        décimale sans séparateur de milliers. Colonnes : Date, Date de valeur, Date d'achat, Libellé, Détails (séparés par ` | `),
        Commerçant, Catégorie, Nature, Type, Section, Débit (positif), Crédit (positif), Montant (signé, négatif pour un débit), Relevé.
        Une cellule de texte qui commence par `=`, `+`, `-`, `@`, une tabulation ou un retour à la ligne est précédée d'une
        apostrophe ; une cellule qui contient `;`, un guillemet ou un saut de ligne est entre guillemets, guillemets doublés.
        Nom du fichier (`Content-Disposition`) : `tirelire-operations-<début>_<fin>.csv`, d'après `from` et `to`, sinon d'après
        la première et la dernière date de la sélection.
      parameters:
        - { $ref: "#/components/parameters/statement" }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { $ref: "#/components/parameters/category" }
        - { $ref: "#/components/parameters/merchant" }
        - { $ref: "#/components/parameters/unclassified" }
        - { $ref: "#/components/parameters/q" }
        - { $ref: "#/components/parameters/min" }
        - { $ref: "#/components/parameters/max" }
        - { $ref: "#/components/parameters/direction" }
        - { $ref: "#/components/parameters/type" }
        - { $ref: "#/components/parameters/date" }
      responses:
        "200":
          description: "Fichier CSV, `Content-Disposition: attachment`"
          content:
            text/csv: { schema: { type: string } }
        "400": { description: "`invalid` : filtre illisible" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /operations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: "Une opération (`tirelire:access`)"
      responses:
        "200": { description: "`{operation: Operation}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : opération inconnue ou d'une autre personne" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /operations/{id}/category:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: "Reclasser une opération, seule ou avec tout son commerçant (`tirelire:access`)"
      description: |
        Corps `{category_id, scope}`. `scope: merchant` : la catégorie devient celle du commerçant de l'opération, appliquée à toutes
        ses opérations, passées et à venir (`category_id: null` retire cette règle) ; refusé si l'opération n'a pas de commerçant.
        `scope: operation` : exception pour cette seule opération, que les règles ne modifient plus ; `category_id: null` retire
        l'exception et l'opération reprend le classement des règles.
      responses:
        "200": { description: "`{operation: Operation, reclassified}`" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : opération inconnue ou d'une autre personne" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /unclassified:
    get:
      summary: "File « à classer » : opérations sans catégorie, regroupées par commerçant (`tirelire:access`)"
      responses:
        "200":
          description: |
            `{operations, merchants, debits, credits, groups: [{merchant_id, merchant_name, operations, debits, credits, first_date,
            last_date, sample: [Operation]}]}`. `operations` et `merchants` : nombres d'opérations et de groupes à classer ; un groupe
            par commerçant, ou par opération quand elle n'a pas de commerçant (`merchant_id: null`) ; `sample` : ses trois opérations les
            plus récentes ; 200 groupes au plus, les plus fournis d'abord.
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /unclassified/count:
    get:
      summary: "Compteur de la file « à classer » (`tirelire:access`)"
      responses:
        "200": { description: "`{operations, merchants, debits, credits}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /categories:
    get:
      summary: "Catégories de la personne, archivées en dernier (`tirelire:access`)"
      responses:
        "200": { description: "`{categories: [Categorie]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
    post:
      summary: "Créer une catégorie (`tirelire:access`)"
      description: "Corps `{name, kind, monthly_cap?}` ; `name` : 1 à 40 caractères ; 100 catégories au plus."
      responses:
        "201": { description: "`{category: Categorie}`" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "409": { description: "`conflict` : une catégorie porte déjà ce nom" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      summary: "Renommer une catégorie, changer sa nature ou son plafond, l'archiver (`tirelire:access`)"
      description: |
        Corps `{name?, kind?, monthly_cap?, archived?}` ; seuls les champs présents changent, `monthly_cap: null` retire le plafond.
        Une catégorie archivée garde ses opérations et ses règles, mais ne peut plus être choisie.
      responses:
        "200": { description: "`{category: Categorie}`" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : catégorie inconnue ou d'une autre personne" }
        "409": { description: "`conflict` : une catégorie porte déjà ce nom" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /rules:
    get:
      summary: "Règles de classement, dans l'ordre d'application (`tirelire:access`)"
      responses:
        "200": { description: "`{rules: [Regle]}`" }
        "401": { $ref: "#/components/responses/401" }
