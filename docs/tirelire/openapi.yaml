  /merchants:
    get:
      summary: "Commerçants et tiers de la personne, les plus fréquents d'abord (`tirelire:access`)"
      description: "500 au plus. Un commerçant sans opération n'est rendu que s'il porte une catégorie ou regroupe plusieurs variantes."
      parameters:
        - { name: q, in: query, description: "Texte cherché dans le nom ou dans une variante", schema: { type: string } }
      responses:
        "200": { description: "`{merchants: [Commercant]}`" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
