  /stats/months:
    get:
      summary: "Périodes disponibles et leurs totaux, de la plus ancienne à la plus récente (`tirelire:access`)"
      description: |
        Mode `calendar` : chaque mois couvert par un relevé ou qui porte une opération. Mode `statement` : une période par date
        d'arrêté. Aucun relevé : liste vide.
      parameters:
        - { $ref: "#/components/parameters/mode" }
      responses:
        "200": { description: "`{mode, periods: [Periode + {operations, expenses, income, savings, remaining}]}`, montants en centimes" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /stats/month:
    get:
      summary: "Statistiques d'une période : totaux, catégories, dépassements, cumul et projection (`tirelire:access`)"
      description: |
        Rattachement : en mode `calendar`, une opération appartient au mois de sa date d'achat (paiement par carte), sinon de sa date
        d'opération ; en mode `statement`, à la période du relevé qui la porte, au jour de cette même date ramené dans la période.

        Dépenses : débits moins crédits des catégories `fixe` et `variable`, plus les débits à classer. Revenus : crédits moins débits
        des catégories `revenu`, plus les crédits à classer. Épargne : versements moins retraits. Les catégories `neutre` ne
        comptent nulle part. Reste à vivre : revenus − dépenses − épargne. Les rapports sont des entiers en points de base
        (1 % = 100), arrondis au plus proche, `null` quand le dénominateur est nul ou négatif ; une moyenne est arrondie au centime.

        `overruns` : catégories de dépense au-dessus de leur plafond (`reference: cap`, dès 1 € d'écart), sinon au-dessus de leur
        moyenne des 3 dernières périodes complètes (`reference: average`, dès 10 € et 10 % d'écart, moyenne strictement positive).
        `cumulative` : dépenses cumulées jour par jour ; `previous` et `average` (au plus 12 périodes complètes) sont ramenées à la
        durée de la période, leur dernier jour portant leur total. `projection` : seulement pour une période `open` du mode
        `calendar`, couverte depuis son premier jour et connue sur 5 jours au moins ; dépenses variables et à classer prolongées au
        rythme des jours connus, chaque catégorie fixe portée à sa moyenne des 3 dernières périodes complètes si elle n'y est pas
        encore. Sinon `projection` est `null` et `projection_reason` vaut `complete`, `partial` ou `too_early`.
      parameters:
        - { $ref: "#/components/parameters/mode" }
        - { $ref: "#/components/parameters/period" }
      responses:
        "200":
          description: |
            `{mode, period: Periode, previous_id, next_id, periods, operations,
            expenses: {total, fixed, variable, unclassified, fixed_bp, variable_bp, unclassified_bp, previous, previous_to_date, avg3, avg12},
            income: {total, classified, unclassified, unclassified_operations, previous}, savings: {total, rate_bp, previous},
            remaining: {total, previous}, budget: {total, spent, bp, delta, uncapped} | null, categories: [LigneCategorie],
            unclassified: {amount, operations, share_bp, previous},
            overruns: [{category_id, reference, reference_amount, periods, excess, excess_bp, rank_amount, rank_percent}], overrun_total,
            cumulative: {current: [centimes], previous: {id, values} | null, average: {periods, values} | null},
            projection: {total, variable, fixed, fixed_pending, daily_variable, remaining_days, budget_delta} | null, projection_reason,
            history: [{id, from, to, complete, expenses, income, savings, remaining, savings_rate_bp}]}`.
            `previous`, `avg3`, `avg12` : Ecart ou `null` ; `previous_to_date` : Ecart avec la période précédente arrêtée au même
            jour, pour une période `open` ; `budget` : somme des plafonds des catégories de dépense non archivées, `null` sans aucun
            plafond, `uncapped` : dépenses hors catégories plafonnées ; `categories` : catégories de dépense, de la plus forte à la
            plus faible ; `overruns` : du plus fort écart en centimes au plus faible, `rank_percent` donne le rang en pourcentage ;
            `history` : 12 périodes au plus, celle-ci en dernier.
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : période sans relevé" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /stats/month/categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: "Une catégorie sur une période : historique, commerçants et dernières opérations (`tirelire:access`)"
      parameters:
        - { $ref: "#/components/parameters/mode" }
        - { $ref: "#/components/parameters/period" }
      responses:
        "200":
          description: |
            `{mode, period: Periode, previous_id, next_id, periods, category: LigneCategorie,
            history: [{id, from, to, complete, amount}], over_cap,
            merchants: [{merchant_id, name, amount, operations, average, previous}], merchants_total,
            operations: [Operation], operations_total}`. `history` : 12 périodes au plus, celle-ci en dernier ; `over_cap` : nombre
            de ces périodes au-dessus du plafond actuel ; `merchants` : 20 au plus, du plus fort montant au plus faible, `average`
            le montant moyen par opération, `previous` l'Ecart avec la période précédente ; `operations` : les 5 plus récentes.
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : période sans relevé, catégorie inconnue ou d'une autre personne" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /stats/history:
    get:
      summary: "Dépenses par catégorie, période par période, avec totaux, moyennes, plafonds et tendances (`tirelire:access`)"
      description: |
        Mêmes définitions que `/stats/month` : dépenses nettes des remboursements, date d'achat pour un paiement par carte, épargne
        et catégories `neutre` exclues, « à classer » sur une ligne à part. La somme des catégories et de `unclassified` égale
        `total` pour chaque période, et `total.amounts` égale `expenses.total` de `/stats/month`.
      parameters:
        - { $ref: "#/components/parameters/mode" }
        - { $ref: "#/components/parameters/window" }
      responses:
        "200":
          description: |
            `{mode, window, available, complete, periods: [{id, from, to, complete, open, expenses}], trend_period_ids,
            categories: [{id, name, kind, color, archived, monthly_cap, amounts, total, average, over_cap, trend: Tendance}],
            unclassified: {amounts, total, average},
            total: {amounts, total, average, budget, over_budget, trend: Tendance},
            chart: {category_ids, others, others_categories}}`. `periods` : les `window` dernières périodes, de la plus ancienne à
            la plus récente (vide sans relevé) ; `available` : nombre de périodes en tout ; `complete` : nombre de périodes complètes
            de la fenêtre. `amounts` : un montant par période, dans le même ordre. `average` : moyenne des périodes complètes de la
            fenêtre, `null` s'il n'y en a aucune. `over_cap` : nombre de périodes de la fenêtre au-dessus du plafond actuel, `null`
            sans plafond ; `budget` : somme des plafonds, `over_budget` : nombre de périodes dont les dépenses le dépassent.
            `categories` : catégories de dépense qui ont un montant dans la fenêtre ou un plafond, du plus fort total au plus
            faible. `trend_period_ids` : périodes sur lesquelles portent les tendances. `chart` : les 5 catégories au plus fort
            total (`category_ids`), les `others_categories` autres regroupées dans `others`.
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /stats/balance:
    get:
      summary: "Solde de chaque compte jour par jour sur la fenêtre affichée (`tirelire:access`)"
      description: |
        Pour chaque relevé : l'ancien solde à sa date, puis chaque jour jusqu'à la date d'arrêté, le solde de la veille plus les
        crédits moins les débits du jour (date d'opération ; une opération datée hors du relevé compte à son premier ou à son
        dernier jour). Les jours qu'aucun relevé ne couvre ne sont pas interpolés : ils séparent deux `segments` et figurent dans
        `gaps`. La fenêtre va du premier jour de la première période affichée au dernier jour connu de la dernière.
      parameters:
        - { $ref: "#/components/parameters/mode" }
        - { $ref: "#/components/parameters/window" }
      responses:
        "200":
          description: |
            `{mode, window, from, to, accounts: [{account_id, days, reconciled, segments: [{from, to, values}],
            gaps: [{from, to, days}], first, last, min, max}]}`. `values` : un solde en centimes par jour de `from` à `to` ;
            `first`, `last`, `min`, `max` : `{date, amount}` du premier et du dernier jour connus, du solde le plus bas et du plus
            haut (le premier jour qui l'atteint), `null` si la fenêtre ne contient aucun jour couvert ; `days` : nombre de jours
            couverts ; `reconciled` : pour chaque relevé du compte, le solde calculé à la date d'arrêté égale son nouveau solde.
            Sans relevé : `from` et `to` valent `null`, `accounts` est vide.
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /stats/years:
    get:
      summary: "Dépenses d'une année sur l'autre : même mois et cumul depuis janvier, par total et par catégorie (`tirelire:access`)"
      description: |
        Une période appartient au mois de son premier jour (mode `calendar`) ou de sa date d'arrêté (mode `statement`). L'année
        et le mois sont ceux de la période demandée ; les périodes postérieures ne comptent pas.
      parameters:
        - { $ref: "#/components/parameters/mode" }
        - { $ref: "#/components/parameters/period" }
      responses:
        "200":
          description: |
            `{mode, period, year, month, previous_year, has_previous, compared_months, partial,
            months: [{month, current, current_complete, previous, previous_complete}],
            total: Comparaison, categories: [{id, name, kind, color} + Comparaison], unclassified: Comparaison}`, avec
            Comparaison = `{month, month_previous: Ecart | null, ytd, ytd_compared: {current, previous, delta, delta_bp} | null}`.
            `month` : montant du mois ; `month_previous` : Ecart avec le même mois de l'année précédente, `null` s'il n'a aucune
            période ; `ytd` : cumul de janvier à ce mois ; `ytd_compared` : cumuls des deux années sur les seuls mois présents dans
            les deux (`compared_months`), `null` s'il n'y en a aucun ; `partial` : l'un de ces mois n'est pas complet.
            `has_previous` : l'année précédente a au moins une période. `months` : les 12 mois, dépenses de chaque année, `null`
            pour un mois sans période. `categories` : catégories de dépense, du plus fort cumul au plus faible.
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : période sans relevé" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /stats/habits:
    get:
      summary: "Habitudes sur une fenêtre : commerçants, petits achats répétés, jours et semaines, opérations inhabituelles (`tirelire:access`)"
      description: |
        Mêmes périodes et même rattachement que `/stats/month`. Tout porte sur les dépenses variables et « à classer » (les
        catégories `fixe` relèvent de `/stats/recurring` ; épargne, revenus et neutre sont exclus), nettes des remboursements.
        La fenêtre réunit les `window` dernières périodes ; `previous` est la fenêtre de même longueur qui la précède, `null` si
        elle n'existe pas en entier ou avec `window=all`.
      parameters:
        - { $ref: "#/components/parameters/mode" }
        - { name: window, in: query, description: "Nombre de périodes réunies, les plus récentes : `1`, `3`, `6`, `12`, ou `all`", schema: { type: string, enum: ["1", "3", "6", "12", all], default: "3" } }
      responses:
        "200":
          description: |
            `{mode, window, available, current: Plage | null, previous: Plage | null, known_through, covered_days,
            operations_from, operations_to, variable,
            merchants: [{merchant_id, name, category_id, amount, count, average, previous: Ecart | null, rank_amount, rank_count}],
            merchants_total,
            small: {threshold, min_repeats, count, amount, yearly, covered_days, min_days,
            merchants: [{merchant_id, name, count, amount, yearly}], merchants_total},
            weekdays: Repartition, weeks: Repartition,
            unusual: {total, operations: [{id, date, amount, merchant_id, merchant_name, category_id, reason: Raison}]}}`, avec
            Plage = `{from, to, periods}` et Repartition = `{amount, count, buckets: [{rank, from_day, to_day, amount, count, days,
            per_day}]}`. `covered_days` : jours de la fenêtre couverts par un relevé ; `operations_from`, `operations_to` : bornes à
            passer à `/operations` (avec `date=purchase` en mode `calendar`) pour lister les opérations de la fenêtre ; `variable` :
            dépenses variables et à classer de la fenêtre. `merchants` : `amount` net des remboursements, `count` débits, `average`
            panier moyen ; les 10 premiers par montant (`rank_amount`) et les 10 premiers par nombre (`rank_count`), triés par
            montant. `small` : débits strictement sous `threshold` chez un commerçant qui en compte au moins `min_repeats` dans la
            fenêtre ; `yearly` : montant × 365 ÷ `covered_days`, une estimation, `null` sous `min_days` jours couverts ; 5
            commerçants au plus. `weekdays` : paiements par carte seulement, `rank` 1 (lundi) à 7 (dimanche) ; `weeks` : toutes les
            dépenses variables, par jour du mois (`from_day` à `to_day` : 1–7, 8–14, 15–21, 22–28, 29–31) ; `days` : jours
            couverts de la tranche, `per_day` : montant ÷ `days`, `null` sans jour couvert. `unusual` : 20 opérations au plus,
            de la plus récente à la plus ancienne ; Raison est décrite à `/operations/{id}/unusual`. Sans relevé : `current` vaut
            `null` et les listes sont vides.
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /stats/recurring:
    get:
      summary: "Abonnements et charges récurrentes détectés sur tout l'historique, avec leurs alertes (`tirelire:access`)"
      description: |
        Détection sur les débits de la personne, par commerçant : montants proches (5 %, 1 € au moins) et cadence régulière.
        La date de référence est celle du dernier relevé importé (`as_of`), jamais la date du jour. Les catégories `epargne`,
        `revenu` et `neutre` sont exclues. Les totaux ne comptent que les récurrents actifs et non écartés.
      responses:
        "200":
          description: |
            `{as_of, from, span_days, statements, detectable, items: [Recurrent], alerts_unseen,
            total: Totaux, subscriptions: Totaux, charges: Totaux}`, avec Totaux = `{count, monthly, yearly}` et Recurrent =
            `{id, merchant_id, name, category_id, group, cadence, amount, occurrences, since, last_date, last_operation_id,
            next_date, missed, status, monthly, yearly, dismissed, alerts: [Alerte]}`. `cadence` : `weekly`, `monthly`,
            `quarterly` ou `yearly` ; `group` : `charge` (catégorie `fixe` autre que la catégorie par défaut Abonnements : loyer,
            crédit, assurance, énergie…) ou `subscription` ; `amount` : dernier montant ; `since` : première échéance connue ;
            `next_date` : prochaine échéance estimée, `null` si arrêté ; `missed` : échéances attendues et couvertes par un
            relevé, sans opération ; `status` : `active` ou `stopped` ; `yearly` : dernier montant × échéances par an, `monthly` :
            `yearly` ÷ 12 ; `dismissed` : écarté par la personne. Alerte = `{kind, seen, date, operation_id, first_date,
            old_amount, new_amount, delta, delta_bp, yearly_delta}`, `kind` : `new` (apparu depuis 120 jours au plus) ou
            `amount_changed` (montant changé depuis 120 jours au plus). `alerts_unseen` : alertes non vues des récurrents actifs
            et non écartés. `detectable` : cadences que la durée couverte (`span_days`, de `from` à `as_of`) permet de confirmer.
            `items` : actifs du plus coûteux par an au moins coûteux, puis arrêtés, puis écartés. Sans relevé : `as_of` vaut
            `null`, `items` est vide.
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
  /stats/recurring/{id}:
    parameters:
      - { name: id, in: path, required: true, description: "Identifiant rendu par `/stats/recurring` (commerçant et cadence, par exemple `42-monthly`)", schema: { type: string } }
    patch:
      summary: "Écarter ou rétablir un récurrent, marquer ses alertes comme vues (`tirelire:access`)"
      description: |
        Corps `{dismissed}` ou `{seen: true}`, ou les deux. `dismissed: true` : ce n'est pas un abonnement, il sort des totaux et
        des alertes ; `false` le rétablit. `seen: true` marque comme vues les alertes actuelles du récurrent : un changement de
        montant ultérieur redevient une alerte. L'état est gardé par personne, commerçant et cadence (table `recurrents`).
      responses:
        "200": { description: "Même corps que `GET /stats/recurring`, recalculé" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "403": { $ref: "#/components/responses/403" }
        "404": { description: "`not_found` : récurrent inconnu ou d'une autre personne" }
        "502": { $ref: "#/components/responses/502" }
        "503": { $ref: "#/components/responses/503" }
