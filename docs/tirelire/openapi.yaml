    post:
      summary: "Regrouper d'autres commerçants dans celui-ci (`tirelire:access`)"
      description: |
        Corps `{merchant_ids}` : 1 à 50 autres commerçants de la personne. Leurs variantes passent à ce commerçant, qui garde son nom
